<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANGUARD // PERSONNEL TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E14;
    --panel:#131822;
    --panel-alt:#1A2130;
    --amber:#FFB238;
    --amber-dim:#C98A2A;
    --threat:#E4572E;
    --text:#E8E6DD;
    --text-dim:#8A93A6;
    --success:#6FCF97;
    --border:#2A3345;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--void);color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    min-height:100vh;position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;z-index:9999;
  }
  .disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .dim{color:var(--text-dim);}
  .amber{color:var(--amber);}
  .threat{color:var(--threat);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 2.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .brand-title{font-size:15px;font-weight:600;letter-spacing:0.08em;}
  .brand-sub{font-size:10px;color:var(--text-dim);letter-spacing:0.12em;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .who{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  select{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:2px;letter-spacing:0.03em;}
  button{cursor:pointer;border:1px solid var(--amber-dim);background:transparent;color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:9px 14px;border-radius:2px;transition:all .15s;text-transform:uppercase;}
  button:hover{background:rgba(255,178,56,0.1);}
  button.primary{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600;}
  button.primary:hover{background:#ffc35e;}
  button.ghost{border-color:var(--border);color:var(--text-dim);}
  button.ghost:hover{color:var(--text);border-color:var(--text-dim);}
  button.danger{border-color:var(--threat);color:var(--threat);}
  button.small{padding:5px 9px;font-size:10px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}

  .layout{display:flex;min-height:calc(100vh - 64px);}
  .nav{width:190px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);padding:18px 0;}
  .nav-item{padding:12px 22px;font-size:12px;letter-spacing:0.08em;cursor:pointer;color:var(--text-dim);border-left:2px solid transparent;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .nav-item:hover{color:var(--text);}
  .nav-item.active{color:var(--amber);border-left-color:var(--amber);background:rgba(255,178,56,0.06);}
  .main{flex:1;padding:26px;max-width:1040px;}

  .bracket-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--amber-dim);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
  .bracket-label::before{content:"[";color:var(--border);}
  .bracket-label::after{content:"]";color:var(--border);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:22px;margin-bottom:20px;}
  .panel-title{font-size:22px;font-weight:600;margin-bottom:4px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:760px){.grid2{grid-template-columns:1fr;} .layout{flex-direction:column;} .nav{width:100%;display:flex;overflow-x:auto;padding:0;} .nav-item{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;} .nav-item.active{border-left-color:transparent;border-bottom-color:var(--amber);}}

  .gauge-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .gauge{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .gauge-inner{width:112px;height:112px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-pct{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;color:var(--amber);}
  .gauge-label{font-size:9px;color:var(--text-dim);letter-spacing:0.1em;margin-top:2px;}

  .loc-row{margin-bottom:14px;}
  .loc-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .loc-name{font-weight:500;}
  .loc-pct{font-family:'IBM Plex Mono',monospace;color:var(--amber);}
  .bar-track{height:8px;background:var(--panel-alt);border:1px solid var(--border);border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));transition:width .4s;}
  .loc-target{font-size:10px;color:var(--text-dim);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

  .stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-val{font-family:'IBM Plex Mono',monospace;color:var(--amber);}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;letter-spacing:0.08em;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;border:1px solid currentColor;}
  .status-active{color:var(--success);}
  .status-alert{color:var(--amber);}
  .status-standby, .status-reserve, .status-deep{color:var(--threat);}
  .pill{display:inline-block;padding:3px 10px;border-radius:3px;font-size:11px;letter-spacing:0.05em;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;background:var(--panel-alt);border:1px solid var(--border);}
  .pill.rank{color:var(--amber);border-color:var(--amber-dim);}
  .pill.eligible{color:var(--success);border-color:var(--success);}
  .pill.not-eligible{color:var(--threat);border-color:var(--threat);}

  .sub-bars{margin-top:12px;}
  .sub-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;}
  .sub-bar-label{width:130px;color:var(--text-dim);flex-shrink:0;}
  .sub-bar-track{flex:1;height:5px;background:var(--panel-alt);border-radius:2px;overflow:hidden;}
  .sub-bar-fill{height:100%;background:var(--amber-dim);}
  .sub-bar-val{width:34px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--text-dim);}

  label{display:block;font-size:11px;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:16px;}
  input[type=number], input[type=text], input[type=password], textarea{
    width:100%;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);
    padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:14px;border-radius:2px;
  }
  .radio-group{display:flex;gap:10px;flex-wrap:wrap;}
  .radio-opt{flex:1;min-width:140px;border:1px solid var(--border);padding:10px 12px;border-radius:2px;cursor:pointer;font-size:12px;text-align:center;color:var(--text-dim);}
  .radio-opt.sel{border-color:var(--amber);color:var(--amber);background:rgba(255,178,56,0.07);}
  .loc-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  @media(max-width:600px){.loc-pick{grid-template-columns:1fr;}}
  .loc-opt{border:1px solid var(--border);padding:10px;border-radius:2px;cursor:pointer;font-size:11px;}
  .loc-opt.sel{border-color:var(--amber);background:rgba(255,178,56,0.07);}
  .loc-opt-name{font-weight:600;margin-bottom:2px;}
  .loc-opt-obj{color:var(--text-dim);font-size:10px;}

  .feedback{margin-top:16px;padding:14px 16px;border-left:3px solid var(--amber);background:var(--panel-alt);font-size:13px;line-height:1.5;border-radius:2px;}
  .feedback.cap{border-left-color:var(--threat);}
  .feedback.win{border-left-color:var(--success);}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-weight:500;padding:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.05em;font-size:10px;}
  td{padding:9px 8px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--panel-alt);}

  .empty{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-title{font-size:14px;margin-bottom:6px;color:var(--text);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;}

  .info-note{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:10px;padding:10px 12px;background:var(--panel-alt);border-radius:2px;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{max-width:480px;width:100%;}
  .login-title{font-size:26px;text-align:center;margin-bottom:6px;}
  .login-sub{text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:30px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.08em;}
  .roster-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  @media(max-width:480px){.roster-grid{grid-template-columns:1fr;}}
  .roster-card{border:1px solid var(--border);border-radius:3px;padding:16px;cursor:pointer;text-align:center;background:var(--panel);}
  .roster-card:hover{border-color:var(--amber-dim);}
  .avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:#1a1206;}
  .roster-name{font-weight:600;font-size:13px;letter-spacing:0.04em;}
  .roster-id{font-size:10px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--text);}

  .exercise-pending{border:1px solid var(--border);border-radius:2px;padding:10px 12px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .set-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
  .set-row input{flex:1;}
  .set-row span{width:16px;text-align:center;color:var(--text-dim);font-size:11px;}

  .dossier-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:16px;}
  .dossier-avatar{width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:#1a1206;flex-shrink:0;}
  .field-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center;}
  .field-row:last-child{border-bottom:none;}
  .field-label{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;}

  .chat-scroll{max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:16px;padding-right:4px;}
  .chat-msg{padding:10px 14px;border-radius:2px;font-size:13px;max-width:80%;}
  .chat-msg.mine{align-self:flex-end;background:rgba(255,178,56,0.1);border:1px solid var(--amber-dim);}
  .chat-msg.theirs{align-self:flex-start;background:var(--panel-alt);border:1px solid var(--border);}
  .chat-msg.command{align-self:center;max-width:90%;background:rgba(255,178,56,0.08);border:1px solid var(--amber);}
  .chat-meta{font-size:10px;color:var(--text-dim);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;}
  .campaign-card{border:1px solid var(--border);border-radius:3px;padding:16px;margin-bottom:14px;}
  .campaign-card.deployed{border-color:var(--amber);}
  .status-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
  .status-tag.recruiting{color:var(--success);border:1px solid var(--success);}
  .status-tag.active{color:var(--amber);border:1px solid var(--amber);}
  .status-tag.success{color:var(--success);border:1px solid var(--success);background:rgba(111,207,151,0.1);}
  .status-tag.failed{color:var(--threat);border:1px solid var(--threat);}

  .mini-chat{position:fixed;bottom:16px;right:16px;width:280px;background:var(--panel);border:1px solid var(--amber-dim);border-radius:4px;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,0.4);}
  .mini-chat-head{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--amber);display:flex;justify-content:space-between;align-items:center;cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;}
  .mini-chat-body{max-height:220px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .mini-chat-msg{font-size:11px;line-height:1.4;}
  .mini-chat-msg .who{color:var(--amber-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;}
  @media(max-width:760px){.mini-chat{width:calc(100% - 32px);}}

  .codex-entry{border:1px solid var(--border);border-radius:3px;padding:14px 16px;margin-bottom:12px;}
  .codex-entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .codex-cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}

  .protocol-card{border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:10px;}
  .protocol-card.full{opacity:0.5;}
  .galaxy-wrap{position:relative;min-height:520px;border-radius:4px;overflow:hidden;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.3), transparent),
      #05070d;
    border:1px solid var(--border);
  }
  .galaxy-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,178,56,0.35), transparent 70%);border:1px solid var(--amber-dim);
    display:flex;align-items:center;justify-content:center;z-index:2;}
  .galaxy-core-dot{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);}
  .galaxy-core-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:var(--amber-dim);font-family:'IBM Plex Mono',monospace;letter-spacing:0.08em;margin-top:4px;}
  .planet-node{position:absolute;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s;z-index:3;}
  .planet-node:hover{transform:scale(1.15);}
  .planet-dot{width:16px;height:16px;border-radius:50%;}
  .planet-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;margin-top:6px;text-align:center;}
  .faction-kharvax{background:radial-gradient(circle, rgba(228,87,46,0.4), transparent 70%);border:1px solid #E4572E;}
  .faction-kharvax .planet-dot{background:#E4572E;box-shadow:0 0 10px #E4572E;}
  .faction-voss{background:radial-gradient(circle, rgba(124,169,232,0.35), transparent 70%);border:1px solid #7CA9E8;}
  .faction-voss .planet-dot{background:#7CA9E8;box-shadow:0 0 10px #7CA9E8;}
  .faction-skarn{background:radial-gradient(circle, rgba(111,207,151,0.35), transparent 70%);border:1px solid #6FCF97;}
  .faction-skarn .planet-dot{background:#6FCF97;box-shadow:0 0 10px #6FCF97;}
  .faction-unknown{background:radial-gradient(circle, rgba(138,147,166,0.3), transparent 70%);border:1px dashed #8A93A6;}
  .faction-unknown .planet-dot{background:#8A93A6;}
  .galaxy-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--text-dim);}
  .galaxy-legend-item{display:flex;align-items:center;gap:6px;}
  .galaxy-legend-dot{width:10px;height:10px;border-radius:50%;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;

const AVATAR_COLORS = ['#FFB238','#E4572E','#6FCF97','#7CA9E8','#C98AD1','#F2C94C'];
const AGE_DIVISIONS = ['Cadet','Corps','Veteran'];
// Player-selectable specializations. Command and Engineer are NOT in this list —
// they're conferred titles tied to Admin/Moderator status, not chosen tracks.
const SPECIALIZATIONS = [
  {name:'Heavy Assault', desc:'Strength and physical capability. Strength, power, load capacity.'},
  {name:'Recon', desc:'Endurance and adaptability. Running, mobility, conditioning.'},
  {name:'Guardian', desc:'Resilience and support. Recovery, health, helping others.'},
  {name:'Demolitions Expert', desc:'"Orbital Bombardment." Explosive power and metabolic conditioning — plyometrics, power circuits, high-intensity finishers. Short, brutal sessions.'},
  {name:'Marksman / Tactical Operator', desc:'"Precision Strike Protocol." Technique, core stability, unilateral strength, controlled tempo. Quality over quantity — one shot, one kill, no wasted movement.'},
];
// Titles conferred automatically by role, not chosen — see updateOpField in AdminPanel.
const CONFERRED_TITLES = { admin: 'Command', moderator: 'Engineer' };
const RANK_ORDER = ['Recruit','Operator','Senior Operator','Specialist','Vanguard'];
// Rank requirements now check three things: ORS, lifetime Days Active, and Campaigns Completed.
const RANK_REQUIREMENTS = {
  'Operator':        { ors:50, daysActive:14,  campaigns:0 },
  'Senior Operator': { ors:65, daysActive:45,  campaigns:1 },
  'Specialist':      { ors:75, daysActive:90,  campaigns:2 },
  'Vanguard':        { ors:90, daysActive:180, campaigns:3 },
};

const RANK_UP_LINES = {
  'Operator': "Recruit no more. Command has reviewed your file — consistency, not perfection, and it shows. Welcome to full operational status, Operator.",
  'Senior Operator': "Multiple Campaigns behind you now. Command doesn't hand out 'Senior' lightly. You've earned the weight of that word.",
  'Specialist': "Command has flagged your file for advanced standing. Whatever track you choose next, you've already proven you finish what you start.",
  'Vanguard': "There's a reason this rank has a name and not just a number. You are what the Initiative was built to create. Command salutes you.",
};

const COMMAND_QUIPS = [
  "High Command wants a report on 'operator morale.' I told them morale is high. I have no idea if that's true. Please make it true.",
  "Reminder from Command: the Kharvax do not observe weekends. Neither, technically, do push-ups.",
  "High Command approved a new commendation for 'Exceptional Hydration.' Please drink water. Please also stop asking why.",
  "Command has been asked to remind everyone that 'creative interpretation' of a Protocol still counts, as long as the work actually happened.",
  "Somewhere in the Hollow Reach, a Kharvax colony has no idea today is leg day. Let's keep it that way.",
  "High Command sent a 40-page memo about 'synergy.' Command read page one. Command believes in you regardless.",
  "Today's briefing is short: show up, log it, move on. The Swarm respects consistency more than heroics.",
];

// EXERCISES and PROTOCOL_SESSIONS moved to the database (exercises / protocol_sessions tables) — fetched at load time, admin-editable in the Admin Panel.
const DEFAULT_CAMPAIGN_SEED = {
  id: 'first_light', name: 'OPERATION FIRST LIGHT', threat: 'KHARVAX SWARM', sector: 'The Hollow Reach',
  startDate: null, joinWindowDays: 5, durationDays: 28,

function computeLocationProgress(camp, logs) {
  return camp.locations.map(loc => {
    const target = locationTarget(camp, loc);
    const relevant = logs.filter(l => l.type === 'campaign' && l.campaignId === camp.id && l.locationId === loc.id);
    const groups = {};
    relevant.forEach(l => { const key = l.operatorId + '_' + l.date; (groups[key] = groups[key] || []).push(l); });
    let total = 0;
    Object.values(groups).forEach(entries => {
      entries.sort((a,b) => a.timestamp - b.timestamp);
      entries.forEach((e, idx) => { total += idx === 0 ? e.amount : e.amount * 0.5; });
    });
    const pct = target > 0 ? Math.min(100, (total / target) * 100) : 0;
    return Object.assign({}, loc, { total: Math.round(total * 10) / 10, target: target, pct: pct });
  });
}
function computePlanetControl(locProgress) {

function computeBaselineImprovement(operator) {
  if (!operator.baseline || !operator.previousBaseline) return null;
  const metrics = ['pushups','pullups','squats','plankSeconds'];
  const changes = [];
  metrics.forEach(m => {
    const prev = operator.previousBaseline[m], cur = operator.baseline[m];
    if (prev > 0 && cur !== undefined) changes.push(((cur - prev) / prev) * 100);
  });
  if (changes.length === 0) return null;
  const avgChange = changes.reduce((a,b)=>a+b,0) / changes.length;
  const score = Math.max(0, Math.min(100, 50 + avgChange * 5));
  return { score: Math.round(score), avgChange: Math.round(avgChange*10)/10 };
}

// Progressive Overload: compares trailing-30-day training volume against the
// prior 30 days, per exercise, using logged sets/reps/weight — fully automatic,
// no manual retest needed. Uses 30-day windows (not week-over-week) specifically
// so a single deload week doesn't tank the score.
function sessionVolume(logEntry) {
  if (logEntry.sets && logEntry.sets.some(s => parseFloat(s.weight) > 0)) {
    return logEntry.sets.reduce((s, st) => s + (parseFloat(st.reps)||0) * (parseFloat(st.weight)||0), 0);
  }
  return logEntry.totalValue || 0;
}
function computeProgressiveOverload(operatorId, logs) {
  const opLogs = logs.filter(l => l.operatorId === operatorId && l.type === 'protocol');
  if (opLogs.length === 0) return null;
  const today = todayStr();
  const recentCutoff = new Date(); recentCutoff.setDate(recentCutoff.getDate() - 29);
  const priorCutoff = new Date(); priorCutoff.setDate(priorCutoff.getDate() - 59);
  const recentStart = todayStr(recentCutoff), priorStart = todayStr(priorCutoff);

  const byExercise = {};
  opLogs.forEach(l => { (byExercise[l.exercise] = byExercise[l.exercise] || []).push(l); });

  const changes = [];
  Object.keys(byExercise).forEach(exName => {
    const entries = byExercise[exName];
    const recent = entries.filter(l => l.date >= recentStart && l.date <= today);
    const prior = entries.filter(l => l.date >= priorStart && l.date < recentStart);
    if (recent.length === 0 || prior.length === 0) return; // needs data in both windows
    const recentAvg = recent.reduce((s,l)=>s+sessionVolume(l),0) / recent.length;
    const priorAvg = prior.reduce((s,l)=>s+sessionVolume(l),0) / prior.length;
    if (priorAvg > 0) changes.push(((recentAvg - priorAvg) / priorAvg) * 100);
  });
  if (changes.length === 0) return null;
  const avgChange = changes.reduce((a,b)=>a+b,0) / changes.length;
  const score = Math.max(0, Math.min(100, 50 + avgChange * 3));
  return { score: Math.round(score), avgChange: Math.round(avgChange*10)/10, exerciseCount: changes.length };
}

function computeStreak(operatorId, logs) {
  const days = new Set(logs.filter(l=>l.operatorId===operatorId).map(l=>l.date));
  let streak = 0; let cursor = new Date();
  if (!days.has(todayStr())) cursor.setDate(cursor.getDate()-1);
  while (days.has(todayStr(cursor))) { streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}

function computeORS(operatorId, operator, logs) {
  const opLogs = logs.filter(l => l.operatorId === operatorId);
  const firstLogDate = opLogs.length ? opLogs.reduce((min,l) => l.date < min ? l.date : min, opLogs[0].date) : todayStr();
  const windowDays = Math.min(30, Math.max(1, daysBetween(firstLogDate, todayStr()) + 1));
  const uniqueDaysWithLog = new Set(opLogs.map(l => l.date)).size;
  const protocolSessionDays = new Set(opLogs.filter(l => l.type === 'protocol').map(l => l.date)).size;
  const campaignLogs = opLogs.filter(l => l.type === 'campaign');
  const uniqueCampaignDays = new Set(campaignLogs.map(l => l.date)).size;
  const scheduledSessions = (operator.weeklyTarget / 7) * windowDays;
  const protocolCompletionRate = scheduledSessions > 0 ? Math.min(100, (protocolSessionDays / scheduledSessions) * 100) : 0;
  const aarSubmissionRate = Math.min(100, (uniqueDaysWithLog / windowDays) * 100);
  const campaignActiveDayRate = Math.min(100, (uniqueCampaignDays / windowDays) * 100);
  const baselineImp = computeBaselineImprovement(operator);
  const overload = computeProgressiveOverload(operatorId, logs);

  // Physical Capability is itself a weighted blend of available sub-components:
  // consistency (always available), progressive overload (auto, once there's
  // enough logged history), and periodic baseline retest (manual, optional).
  const physComponents = [
    { weight: 0.50, value: protocolCompletionRate, available: true },
    { weight: 0.30, value: overload ? overload.score : null, available: !!overload },
    { weight: 0.20, value: baselineImp ? baselineImp.score : null, available: !!baselineImp },
  ];
  const physWeightSum = physComponents.filter(c=>c.available).reduce((s,c)=>s+c.weight,0);
  let physicalVal = 0;
  physComponents.forEach(c => { if (c.available) physicalVal += (c.weight/physWeightSum) * c.value; });

  const activeHabits = (operator.habits || []).filter(h => h.active);
  let personalDevVal = null;
  if (activeHabits.length > 0) {
    const habitLogs = opLogs.filter(l => l.type === 'habit');
    const possibleCheckins = activeHabits.length * windowDays;
    personalDevVal = possibleCheckins > 0 ? Math.min(100, (habitLogs.length / possibleCheckins) * 100) : 0;
  }
  const components = [
    { key:'physical', weight:0.30, value: physicalVal, available: true },
    { key:'discipline', weight:0.30, value: aarSubmissionRate, available: true },
    { key:'personalDev', weight:0.20, value: personalDevVal, available: personalDevVal !== null },
    { key:'squad', weight:0.20, value: campaignActiveDayRate, available: true },
  ];
  const availWeightSum = components.filter(c=>c.available).reduce((s,c)=>s+c.weight,0);
  let ors = 0;
  components.forEach(c => { if (c.available) ors += (c.weight/availWeightSum) * c.value; });
  ors = Math.round(ors);
  return { ors: ors, physical: Math.round(physicalVal), discipline: Math.round(aarSubmissionRate),
    squad: Math.round(campaignActiveDayRate), personalDev: personalDevVal!==null?Math.round(personalDevVal):null,
    windowDays: windowDays, baselineImp: baselineImp, overload: overload };
}

function computeMCP(operatorId, campaigns, logs) {
  const opLogs = logs.filter(l => l.operatorId === operatorId);
  const protocolDays = new Set(opLogs.filter(l=>l.type==='protocol').map(l=>l.date)).size;
  const campaignEntries = opLogs.filter(l=>l.type==='campaign').length;

// Readiness status now weighs BOTH the gap since your last log AND your rolling logging
// frequency — sparse-but-technically-recent logging will decay status, not just full inactivity.
const STATUS_TIERS = [
  {label:'Active', cls:'status-active'}, {label:'Alert', cls:'status-alert'},
  {label:'Standby', cls:'status-standby'}, {label:'Reserve', cls:'status-reserve'}, {label:'Deep Reserve', cls:'status-deep'},
];
function computeReadinessStatus(operatorId, logs) {
  const opLogs = logs.filter(l => l.operatorId === operatorId);
  if (opLogs.length === 0) return Object.assign({days:0}, STATUS_TIERS[0]);
  const lastDate = opLogs.reduce((max,l) => l.date > max ? l.date : max, opLogs[0].date);
  const gapDays = daysBetween(lastDate, todayStr());
  const gapTierIdx = gapDays<=7?0:gapDays<=14?1:gapDays<=30?2:gapDays<=60?3:4;

  const firstLogDate = opLogs.reduce((min,l) => l.date < min ? l.date : min, opLogs[0].date);
  const historyDays = daysBetween(firstLogDate, todayStr()) + 1;
  let rateTierIdx = 0;
  if (historyDays >= 7) {
    const rateWindow = Math.min(14, historyDays);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (rateWindow - 1));
    const uniqueDays = new Set(opLogs.filter(l => new Date(l.date) >= cutoff).map(l => l.date)).size;
    const rate = uniqueDays / rateWindow;
    rateTierIdx = rate>=0.5?0:rate>=0.3?1:rate>=0.15?2:rate>0?3:4;
  }
  const finalIdx = Math.max(gapTierIdx, rateTierIdx);
  return Object.assign({days: gapDays}, STATUS_TIERS[finalIdx]);
}

// Rank now requires ORS + lifetime Days Active + Campaigns Completed, checked top-down.
function operatorRankStats(operatorId, logs, campaigns) {
  const opLogs = logs.filter(l => l.operatorId === operatorId);
  const daysActive = new Set(opLogs.map(l => l.date)).size;
  const campaignsCompleted = campaigns.filter(c => c.resolved === 'success' && opLogs.some(l => l.type === 'campaign' && l.campaignId === c.id)).length;
  return { daysActive, campaignsCompleted };
}
function computeRank(ors, operatorId, logs, campaigns, status) {
  const stats = operatorRankStats(operatorId, logs, campaigns);
  for (let i = RANK_ORDER.length - 1; i >= 1; i--) {
    const rank = RANK_ORDER[i];
    const req = RANK_REQUIREMENTS[rank];
    if (status.label === 'Active' && ors >= req.ors && stats.daysActive >= req.daysActive && stats.campaignsCompleted >= req.campaigns) return rank;
  }
  return 'Recruit';
}
function nextRankInfo(currentRank, ors, operatorId, logs, campaigns, status) {
  const idx = RANK_ORDER.indexOf(currentRank);
  if (idx === -1 || idx === RANK_ORDER.length - 1) return null;
  const next = RANK_ORDER[idx+1];
  const req = RANK_REQUIREMENTS[next];
  const stats = operatorRankStats(operatorId, logs, campaigns);
  const eligible = status.label === 'Active' && ors >= req.ors && stats.daysActive >= req.daysActive && stats.campaignsCompleted >= req.campaigns;
  return { next: next, req: req, stats: stats, eligible: eligible };
}

  return { id: s.id, protocol: s.protocol, name: s.name, briefing: s.briefing || null, training_note: s.trainingNote || null,
    conditioning_options: s.conditioningOptions || [], requires_specialization: s.requiresSpecialization || null, objectives: s.objectives || [] };
}

async function seedDefaultCampaign() {
  const seed = DEFAULT_CAMPAIGN_SEED;
  const { data: camp, error: e1 } = await sb.from('campaigns').insert({
    name: seed.name, threat: seed.threat, sector: seed.sector, start_date: todayStr(),
    join_window_days: seed.joinWindowDays, duration_days: seed.durationDays,
  }).select().single();
  if (e1) { console.error(e1); return null; }
  const locRows = seed.locations.map(l => ({ campaign_id: camp.id, name: l.name, objective: l.objective, category: l.category, unit: l.unit, manual_target: l.manualTarget }));
  const { data: locs } = await sb.from('locations').insert(locRows).select();
  return rowToCampaign(camp, locs);
}

async function fetchAllData() {
  const { data: profileRows } = await sb.from('profiles').select('*');
  const { data: habitRows } = await sb.from('habits').select('*');
  const { data: squadRows } = await sb.from('squads').select('*');
  const { data: squadMemberRows } = await sb.from('squad_members').select('*');
  let squads = (squadRows||[]).map(s => rowToSquad(s, (squadMemberRows||[]).filter(m=>m.squad_id===s.id)));
  let ops = (profileRows||[]).map(p => {
    const memberRow = (squadMemberRows||[]).find(m => m.operator_id === p.id);
    const op = rowToOperator(p, (habitRows||[]).filter(h=>h.operator_id===p.id).map(rowToHabit));
    op.squadId = memberRow ? memberRow.squad_id : null;
    op.squadRole = memberRow ? memberRow.role : null;
    return op;
  });

  const { data: campRows } = await sb.from('campaigns').select('*');
  const { data: locRows } = await sb.from('locations').select('*');
  let camps = (campRows||[]).map(c => rowToCampaign(c, (locRows||[]).filter(l=>l.campaign_id===c.id)));
  if (camps.length === 0) {
    const seeded = await seedDefaultCampaign();
    if (seeded) camps = [seeded];
  }

  const { data: logRows } = await sb.from('logs').select('*');
  const lgs = (logRows||[]).map(rowToLog);

  const { data: chatRows } = await sb.from('chat_messages').select('*').order('timestamp', {ascending:true});
  const ch = (chatRows||[]).map(rowToChat);

  const { data: codexRows } = await sb.from('codex_entries').select('*');
  const cx = (codexRows && codexRows.length) ? codexRows.map(rowToCodex) : DEFAULT_CODEX_ENTRIES;

  const { data: exerciseRows } = await sb.from('exercises').select('*').order('name');
  const exercises = (exerciseRows||[]).map(rowToExercise);

  const { data: sessionRows } = await sb.from('protocol_sessions').select('*');
  const protocolSessions = (sessionRows||[]).map(rowToProtocolSession);

  // auto-lock join windows / auto-resolve campaigns, writing back any changes
  for (let i = 0; i < camps.length; i++) {
    let c = camps[i];
    if (!c.lockedAt && daysBetween(c.startDate, todayStr()) >= c.joinWindowDays) {
      const count = Math.max(1, c.deployedOperatorIds.length);
      const targets = {}; c.locations.forEach(loc => { targets[loc.id] = locationTarget(c, loc); });
      await sb.from('campaigns').update({ locked_at: todayStr(), locked_targets: targets, locked_deployed_count: count }).eq('id', c.id);
      c = Object.assign({}, c, { lockedAt: todayStr(), lockedTargets: targets, lockedDeployedCount: count });
      camps[i] = c;
    }
    if (!c.resolved && c.lockedAt) {
      const locProg = computeLocationProgress(c, lgs);
      const pct = computePlanetControl(locProg);
      if (pct >= 100) { await sb.from('campaigns').update({resolved:'success'}).eq('id', c.id); camps[i] = Object.assign({}, c, {resolved:'success'}); }
      else if (daysBetween(c.startDate, todayStr()) >= c.durationDays) { await sb.from('campaigns').update({resolved:'failed'}).eq('id', c.id); camps[i] = Object.assign({}, c, {resolved:'failed'}); }
    }
  }

  return { ops, camps, lgs, ch, cx, squads, exercises, protocolSessions };
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [session, setSession] = useState(null);
  const [operators, setOperators] = useState([]);
  const [campaigns, setCampaigns] = useState([]);
  const [logs, setLogs] = useState([]);
  const [chat, setChat] = useState([]);
  const [codexEntries, setCodexEntries] = useState([]);
  const [squads, setSquads] = useState([]);
  const [exercises, setExercises] = useState([]);
  const [protocolSessions, setProtocolSessions] = useState([]);
  const [tab, setTab] = useState('command');
  const [showReset, setShowReset] = useState(false);
  const [viewDossierId, setViewDossierId] = useState(null);
  const [rankUpModal, setRankUpModal] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(({data}) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  async function refetchAll() {
    const { ops, camps, lgs, ch, cx, squads, exercises, protocolSessions } = await fetchAllData();
    setOperators(ops); setCampaigns(camps); setLogs(lgs); setChat(ch); setCodexEntries(cx); setSquads(squads);
    setExercises(exercises); setProtocolSessions(protocolSessions);
  }

  useEffect(() => {
    if (!session) { setLoaded(false); return; }
    (async () => { await refetchAll(); setLoaded(true); })();
  }, [session]);

  // realtime chat subscription
  useEffect(() => {
    if (!session) return;
    const channel = sb.channel('chat-realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        setChat(prev => prev.some(m=>m.id===payload.new.id) ? prev : prev.concat([rowToChat(payload.new)]));
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [session]);

  async function addLogs(entries) {
    await sb.from('logs').insert(entries.map(logToRow));
    await refetchAll();
  }
  async function updateOperator(updatedOp) {
    const old = operators.find(o=>o.id===updatedOp.id) || {};
    const patch = {};
    Object.keys(OP_FIELD_MAP).forEach(k => { if (JSON.stringify(updatedOp[k]) !== JSON.stringify(old[k])) patch[k] = updatedOp[k]; });
    if (Object.keys(patch).length) await sb.from('profiles').update(operatorToRowPatch(patch)).eq('id', updatedOp.id);
    await refetchAll();
  }
  async function updateOperators(newOps) {
    const removed = operators.filter(o => !newOps.some(n=>n.id===o.id));
    for (const r of removed) await sb.from('profiles').delete().eq('id', r.id);
    for (const o of newOps) {
      const old = operators.find(x=>x.id===o.id);
      if (!old) continue;
      const patch = {};
      Object.keys(OP_FIELD_MAP).forEach(k => { if (JSON.stringify(o[k]) !== JSON.stringify(old[k])) patch[k]=o[k]; });
      if (Object.keys(patch).length) await sb.from('profiles').update(operatorToRowPatch(patch)).eq('id', o.id);
    }
    await refetchAll();
  }
  async function updateCampaigns(newCamps) {
    for (const nc of newCamps) {
      const old = campaigns.find(c=>c.id===nc.id);
      if (!old) {
        const { data: inserted } = await sb.from('campaigns').insert({
          name: nc.name, threat: nc.threat, sector: nc.sector, start_date: nc.startDate,
          join_window_days: nc.joinWindowDays, duration_days: nc.durationDays,
        }).select().single();
        if (inserted && nc.locations.length) {
          await sb.from('locations').insert(nc.locations.map(l => ({ campaign_id: inserted.id, name:l.name, objective:l.objective, category:l.category, unit:l.unit, manual_target:l.manualTarget })));
        }
        continue;
      }
      const patch = {};
      Object.keys(CAMP_FIELD_MAP).forEach(k => { if (JSON.stringify(nc[k]) !== JSON.stringify(old[k])) patch[k]=nc[k]; });
      if (Object.keys(patch).length) await sb.from('campaigns').update(campaignToRowPatch(patch)).eq('id', nc.id);
      const newLocIds = new Set(nc.locations.map(l=>l.id));
      const removedLocs = old.locations.filter(l=>!newLocIds.has(l.id));
      for (const rl of removedLocs) await sb.from('locations').delete().eq('id', rl.id);
      for (const nl of nc.locations) {
        const oldLoc = old.locations.find(l=>l.id===nl.id);
        if (!oldLoc) await sb.from('locations').insert({campaign_id: nc.id, name:nl.name, objective:nl.objective, category:nl.category, unit:nl.unit, manual_target:nl.manualTarget});
        else if (JSON.stringify(oldLoc)!==JSON.stringify(nl)) await sb.from('locations').update({name:nl.name, objective:nl.objective, category:nl.category, unit:nl.unit, manual_target:nl.manualTarget}).eq('id', nl.id);
      }
    }
    await refetchAll();
  }
  async function sendChat(msg) {
    await sb.from('chat_messages').insert(chatToRow(msg));
    // realtime subscription will pick up the insert; no need to refetch or setChat here
  }
  async function updateCodex(newEntries) {
    const old = codexEntries;
    const removed = old.filter(e => !newEntries.some(n=>n.id===e.id));
    for (const r of removed) await sb.from('codex_entries').delete().eq('id', r.id);
    for (const e of newEntries) {
      const oldE = old.find(x=>x.id===e.id);
      if (!oldE) await sb.from('codex_entries').insert({ category: e.category, title: e.title, body: e.body });
      else if (oldE.title!==e.title || oldE.body!==e.body) await sb.from('codex_entries').update({title:e.title, body:e.body}).eq('id', e.id);
    }
    await refetchAll();
  }
  async function saveExercise(exercise) {
    const exists = exercises.some(e=>e.id===exercise.id);
    if (exists) await sb.from('exercises').update(exerciseToRow(exercise)).eq('id', exercise.id);
    else await sb.from('exercises').insert(exerciseToRow(exercise));
    await refetchAll();
  }
  async function deleteExercise(exerciseId) {
    await sb.from('exercises').delete().eq('id', exerciseId);
    await refetchAll();
  }
  async function saveProtocolSession(session) {
    const exists = protocolSessions.some(s=>s.id===session.id);
    if (exists) await sb.from('protocol_sessions').update(protocolSessionToRow(session)).eq('id', session.id);
    else await sb.from('protocol_sessions').insert(protocolSessionToRow(session));
    await refetchAll();
  }
  async function deleteProtocolSession(sessionId) {
    await sb.from('protocol_sessions').delete().eq('id', sessionId);
    await refetchAll();
  }
  async function resetAll() {
    await sb.from('logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    await sb.from('chat_messages').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    for (const c of campaigns) await sb.from('campaigns').delete().eq('id', c.id);
    for (const o of operators) await sb.from('profiles').update({ current_deployment_id: null, reinforcement_drops_available: 0, mcp_at_last_reinforcement: 0, last_seen_rank: 'Recruit' }).eq('id', o.id);
    await refetchAll();
    setShowReset(false);
  }
  async function deployToCampaign(op, camp) {
    if (op.currentDeploymentId) return;
    const phase = campaignPhase(camp);
    if (phase === 'recruiting') {
      await sb.from('campaigns').update({ deployed_operator_ids: camp.deployedOperatorIds.concat([op.id]) }).eq('id', camp.id);
      await sb.from('profiles').update({ current_deployment_id: camp.id }).eq('id', op.id);
    } else if (phase === 'active') {
      const capMax = Math.floor(0.2 * camp.lockedDeployedCount);
      if (op.reinforcementDropsAvailable < 1 || camp.reinforcementsUsed >= capMax) return;
      await sb.from('campaigns').update({ deployed_operator_ids: camp.deployedOperatorIds.concat([op.id]), reinforcements_used: camp.reinforcementsUsed + 1 }).eq('id', camp.id);
      await sb.from('profiles').update({ current_deployment_id: camp.id, reinforcement_drops_available: op.reinforcementDropsAvailable - 1 }).eq('id', op.id);
    } else return;
    await refetchAll();

  async function claimReinforcement(op) { await sb.from('profiles').update({reinforcement_drops_available: 1, mcp_at_last_reinforcement: nonCampaignMCP(op.id, logs)}).eq('id', op.id); await refetchAll(); }

  }
  async function renameSquad(squad, newName) {
    await sb.from('squads').update({ name: newName }).eq('id', squad.id);
    await refetchAll();
  }
  async function disbandSquad(squad) {
    await sb.from('squads').delete().eq('id', squad.id);
    await refetchAll();
  }

  async function signOut() { await sb.auth.signOut(); }

  const op = (session && loaded) ? operators.find(o => o.id === session.user.id) : null;
  const opOnboarded = op && op.onboarded;
  const statusTop = opOnboarded ? computeReadinessStatus(op.id, logs) : null;
  const orsDataTop = opOnboarded ? computeORS(op.id, op, logs) : null;
  const currentRankTop = opOnboarded ? computeRank(orsDataTop.ors, op.id, logs, campaigns, statusTop) : null;
  const deployedCampaignTop = (opOnboarded && op.currentDeploymentId) ? campaigns.find(c => c.id === op.currentDeploymentId) : null;

  // Hook runs unconditionally every render and guards its own logic internally —
  // never place this after an early return, or React's hook order breaks.
  useEffect(() => {
    if (!loaded || !opOnboarded || !currentRankTop || !op) return;
    if (RANK_ORDER.indexOf(currentRankTop) > RANK_ORDER.indexOf(op.lastSeenRank || 'Recruit')) {
      setRankUpModal(currentRankTop);
      updateOperator(Object.assign({}, op, {lastSeenRank: currentRankTop}));
    }
  }, [currentRankTop, loaded, opOnboarded]);

  if (!session) return <Login onAuthed={()=>{}} />;
  if (!loaded) return <div style={{padding:40,fontFamily:'IBM Plex Mono, monospace',color:'#8A93A6'}}>ESTABLISHING UPLINK...</div>;
  if (!op) return <div style={{padding:40,fontFamily:'IBM Plex Mono, monospace',color:'#8A93A6'}}>PROVISIONING PERSONNEL FILE... (refresh in a moment if this persists)</div>;
  if (!op.onboarded) return <Onboarding op={op} onComplete={(updatedOp)=>{ updateOperator(updatedOp); }} />;

  const dossierOp = viewDossierId ? operators.find(o=>o.id===viewDossierId) : op;
  const noAdminExists = !operators.some(o => o.isAdmin);
  const streak = computeStreak(op.id, logs);

  return (
    <div>
      <div className="topbar">
        <div className="brand" onClick={()=>{setTab('command'); setViewDossierId(null);}}>
          <div className="brand-dot"></div>
          <div><div className="disp brand-title">Vanguard // Personnel Terminal</div><div className="brand-sub">United Earth Alliance — Alpha Cell</div></div>
        </div>
        <div className="topbar-right">
          <div className="who"><Avatar op={op} size={28} /> {op.callsign}</div>
          <button className="ghost small" onClick={signOut}>Log Out</button>
          <button className="ghost small" onClick={() => setShowReset(true)}>Reset Test Data</button>
        </div>
      </div>

      {noAdminExists && (
        <div style={{background:'var(--panel-alt)',borderBottom:'1px solid var(--amber-dim)',padding:'10px 24px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
          <div style={{fontSize:12}}><span className="amber">No Command assigned.</span> <span className="dim">Claim it to manage Campaign settings, Codex, and roster.</span></div>
          <button className="primary small" onClick={()=>updateOperator(Object.assign({}, op, {isAdmin: true}))}>Claim Command ({op.callsign})</button>
        </div>
      )}

      <div className="layout">
        <div className="nav">
          {(op.isAdmin ? ['command','campaigns','galaxy','log','myprotocols','habits','squad','dossier','roster','codex','comms','aar','admin'] : ['command','campaigns','galaxy','log','myprotocols','habits','squad','dossier','roster','codex','comms','aar']).map(t => (
            <div key={t} className={"nav-item"+(tab===t?" active":"")} onClick={() => {setTab(t); if(t==='dossier') setViewDossierId(op.id);}}>
              {t==='command' && 'Command Center'}{t==='campaigns' && 'Campaigns'}{t==='galaxy' && 'Galaxy Map'}{t==='log' && 'Log Activity'}
              {t==='myprotocols' && 'My Protocols'}{t==='habits' && 'Habits'}{t==='squad' && 'Squad'}{t==='dossier' && 'My Dossier'}{t==='roster' && 'Roster'}
              {t==='codex' && 'Codex'}{t==='comms' && 'Comms'}{t==='aar' && 'AAR Log'}{t==='admin' && 'Admin Panel'}
            </div>
          ))}
        </div>
        <div className="main">
          {tab==='command' && <CommandCenter operators={operators} campaigns={campaigns} logs={logs} activeOp={op} deployedCampaign={deployedCampaignTop} onGoCampaigns={()=>setTab('campaigns')} streak={streak} />}
          {tab==='campaigns' && <Campaigns campaigns={campaigns} activeOp={op} logs={logs} onDeploy={deployToCampaign} onUndeploy={undeploy} onClaimReinforcement={claimReinforcement} />}
          {tab==='galaxy' && <GalaxyMap entries={codexEntries} campaigns={campaigns} logs={logs} onGoCampaigns={()=>setTab('campaigns')} />}
          {tab==='log' && <LogActivity deployedCampaign={deployedCampaignTop} activeOp={op} logs={logs} addLogs={addLogs} campaigns={campaigns} exercises={exercises} protocolSessions={protocolSessions} />}
          {tab==='myprotocols' && <MyProtocols op={op} onSave={saveCustomProtocol} onDelete={deleteCustomProtocol} exercises={exercises} />}
          {tab==='habits' && <Habits op={op} logs={logs} onAddHabit={addHabit} onToggleArchive={toggleHabitArchive} onCheckin={logHabitCheckin} />}
          {tab==='squad' && <SquadTab activeOp={op} operators={operators} squads={squads} logs={logs} campaigns={campaigns}
            onCreate={createSquad} onJoin={joinSquad} onLeave={leaveSquad} onPromote={promoteOfficer} onDemote={demoteOfficer}
            onRemoveMember={removeMember} onRename={renameSquad} onDisband={disbandSquad} />}
          {tab==='dossier' && <Dossier op={dossierOp} operators={operators} campaigns={campaigns} logs={logs} squads={squads} onUpdateOperator={updateOperator} />}
          {tab==='roster' && <Roster operators={operators} campaigns={campaigns} logs={logs} onView={(id)=>{setViewDossierId(id); setTab('dossier');}} />}
          {tab==='codex' && <Codex entries={codexEntries} isAdmin={op.isAdmin} onUpdate={updateCodex} />}
          {tab==='comms' && <Comms chat={chat} operators={operators} squads={squads} activeOp={op} onSend={sendChat} />}
          {tab==='aar' && <AARLog operators={operators} campaigns={campaigns} logs={logs} />}
          {tab==='admin' && op.isAdmin && <AdminPanel operators={operators} campaigns={campaigns} onUpdateOperators={updateOperators} onUpdateCampaigns={updateCampaigns}
            exercises={exercises} protocolSessions={protocolSessions} onSaveExercise={saveExercise} onDeleteExercise={deleteExercise}
            onSaveProtocolSession={saveProtocolSession} onDeleteProtocolSession={deleteProtocolSession} />}
        </div>
      </div>

      {tab !== 'comms' && <MiniChat chat={chat} activeOp={op} onGoComms={()=>setTab('comms')} />}

      {showReset && (
        <div className="modal-overlay" onClick={() => setShowReset(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="disp" style={{fontSize:16,marginBottom:10}}>Reset all test data?</div>
            <div className="dim" style={{fontSize:13,marginBottom:18}}>Clears logs, chat, and Campaigns from the database. Operator accounts, habits, and custom Protocols are kept. Cannot be undone.</div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="ghost" onClick={() => setShowReset(false)}>Cancel</button>
              <button className="danger" onClick={resetAll}>Wipe & Reset</button>
            </div>
          </div>
        </div>
      )}

      {rankUpModal && (
        <div className="modal-overlay" onClick={()=>setRankUpModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{textAlign:'center',borderColor:'var(--amber)'}}>
            <div className="dim mono" style={{fontSize:10,marginBottom:10,letterSpacing:'0.1em'}}>PRIORITY TRANSMISSION — RANK ADVANCEMENT</div>
            <div className="disp amber" style={{fontSize:26,marginBottom:14}}>{rankUpModal}</div>
            <div style={{fontSize:13,lineHeight:1.7,marginBottom:20}}>{RANK_UP_LINES[rankUpModal]}</div>
            <button className="primary" style={{width:'100%'}} onClick={()=>setRankUpModal(null)}>Acknowledge</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CommandCenter({ operators, campaigns, logs, activeOp, deployedCampaign, onGoCampaigns, streak }) {
  const orsData = computeORS(activeOp.id, activeOp, logs);
  const status = computeReadinessStatus(activeOp.id, logs);
  const rank = computeRank(orsData.ors, activeOp.id, logs, campaigns, status);
  const locProgress = deployedCampaign ? computeLocationProgress(deployedCampaign, logs) : [];
  const planetPct = deployedCampaign ? computePlanetControl(locProgress) : 0;
  const daysLeft = deployedCampaign ? Math.max(0, deployedCampaign.durationDays - daysBetween(deployedCampaign.startDate, todayStr())) : 0;
  const quip = dailyQuip(hashStr(todayStr()));
  const loggedToday = logs.some(l => l.operatorId===activeOp.id && l.date===todayStr());

  return (
    <div>
      <div className="panel">
        <div className="bracket-label">Sitrep — {todayStr()}</div>
        <div style={{fontSize:14,marginBottom:8}}>
          {loggedToday ? `Good work today, ${activeOp.callsign}.` : `Command hasn't seen you log anything today yet, ${activeOp.callsign}.`}
          {streak > 0 && <span> Current streak: <span className="amber mono">{streak} day{streak===1?'':'s'}</span>.</span>}
        </div>
        <div style={{fontSize:12,color:'var(--text-dim)',fontStyle:'italic'}}>"{quip}"</div>
      </div>

      {deployedCampaign ? (
        <div className="panel">
          <div className="bracket-label">Your Deployment</div>
          <div className="disp panel-title">{deployedCampaign.name}</div>
          <div className="dim mono" style={{fontSize:12}}>Threat: {deployedCampaign.threat} · {deployedCampaign.sector} · {daysLeft} days remaining</div>
          <div style={{fontSize:12,fontStyle:'italic',color:'var(--amber-dim)',marginTop:10}}>"{campaignMilestoneLine(deployedCampaign, planetPct)}"</div>
          <div style={{marginTop:18}} className="gauge-wrap">
            <Gauge pct={planetPct} />
            <div style={{flex:1,minWidth:220}}>
              {locProgress.map(loc => (
                <div key={loc.id} className="loc-row">
                  <div className="loc-head"><span className="loc-name">{loc.name}</span><span className="loc-pct mono">{Math.round(loc.pct)}%</span></div>
                  <div className="bar-track"><div className="bar-fill" style={{width: loc.pct+'%'}}></div></div>
                  <div className="loc-target">{loc.total} / {loc.target} {loc.unit}</div>
                </div>
              ))}
            </div>
          </div>
          {deployedCampaign.lore && (
            <details style={{marginTop:16}}>
              <summary style={{cursor:'pointer',fontSize:11,color:'var(--text-dim)',fontFamily:"'IBM Plex Mono',monospace",letterSpacing:'0.05em'}}>FULL BRIEFING</summary>
              <div style={{fontSize:12,lineHeight:1.8,color:'var(--text-dim)',marginTop:10,whiteSpace:'pre-line'}}>{deployedCampaign.lore}</div>
            </details>
          )}
        </div>
      ) : (
        <div className="panel">
          <div className="bracket-label">Your Deployment</div>
          <div className="dim" style={{fontSize:13,marginBottom:12}}>Not currently deployed to any Campaign.</div>
          <button className="primary" onClick={onGoCampaigns}>View Campaigns</button>
        </div>
      )}

      <div className="grid2">
        <div className="panel">
          <div className="bracket-label">Operator Status — {activeOp.callsign}</div>
          <div className="stat-row"><span>Rank</span><span className="pill rank">{rank}</span></div>
          <div className="stat-row"><span>Readiness (ORS)</span><span className="stat-val">{orsData.ors} / 100</span></div>
          <div className="stat-row"><span>Status</span><span className={"status-pill "+status.cls}>{status.label}</span></div>
          <div className="sub-bars">
            <SubBar label="Physical Capability" val={orsData.physical} />
            <SubBar label="Mission Discipline" val={orsData.discipline} />
            <SubBar label="Personal Development" val={orsData.personalDev} />
            <SubBar label="Squad Contribution" val={orsData.squad} />
          </div>
        </div>
        <div className="panel">
          <div className="bracket-label">Quick Reference</div>
          <div className="dim" style={{fontSize:12,lineHeight:1.8}}>
            One Campaign deployment at a time. First log per Location per day counts 1:1; additional logs same day count at 50%.<br/><br/>

      </div>
    </div>

}

function Campaigns({ campaigns, activeOp, logs, onDeploy, onUndeploy, onClaimReinforcement }) {
  const deployedId = activeOp.currentDeploymentId;
  const nonCampMCP = nonCampaignMCP(activeOp.id, logs);
  const mcpToNextDrop = Math.max(0, 200 - (nonCampMCP - activeOp.mcpAtLastReinforcement));
  const eligibleForDrop = activeOp.reinforcementDropsAvailable < 1 && mcpToNextDrop <= 0;
  return (
    <div>
      {activeOp.reinforcementDropsAvailable > 0 && (
        <div className="panel" style={{borderColor:'var(--amber)'}}>
          <div className="bracket-label">Reinforcement Drop Available</div>
          <div style={{fontSize:12,color:'var(--text-dim)'}}>You've earned a late-entry pass into any Campaign whose Join Window has already closed.</div>
        </div>
      )}
      {activeOp.reinforcementDropsAvailable === 0 && (
        <div className="panel">
          <div className="bracket-label">Reinforcement Drop Progress</div>
          <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:8}}>{mcpToNextDrop > 0 ? mcpToNextDrop+' MCP to go.' : 'Ready to claim!'}</div>
          {eligibleForDrop && <button className="primary small" onClick={()=>onClaimReinforcement(activeOp)}>Claim Reinforcement Drop</button>}
        </div>
      )}
      {campaigns.map(camp => {
        const phase = campaignPhase(camp);
        const locProg = computeLocationProgress(camp, logs);
        const planetPct = computePlanetControl(locProg);
        const isDeployed = deployedId === camp.id;
        const daysLeft = Math.max(0, camp.durationDays - daysBetween(camp.startDate, todayStr()));
        const joinWindowDaysLeft = Math.max(0, camp.joinWindowDays - daysBetween(camp.startDate, todayStr()));
        const capMax = Math.floor(0.2 * camp.lockedDeployedCount);
        const canDeployReinforcement = phase==='active' && activeOp.reinforcementDropsAvailable>0 && camp.reinforcementsUsed < capMax;
        return (
          <div key={camp.id} className={"campaign-card"+(isDeployed?' deployed':'')}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
              <div><div className="disp" style={{fontSize:18}}>{camp.name}</div><div className="dim mono" style={{fontSize:11}}>{camp.threat} · {camp.sector}</div></div>
              <span className={"status-tag "+(phase==='recruiting'?'recruiting':phase==='active'?'active':phase)}>
                {phase==='recruiting' && `Recruiting (${joinWindowDaysLeft}d left)`}
                {phase==='active' && `Active (${daysLeft}d left)`}
                {phase==='success' && 'Victory'}{phase==='failed' && 'Contested'}
              </span>
            </div>
            <div style={{marginTop:12,fontSize:12}}>Control: <span className="amber mono">{Math.round(planetPct)}%</span> · Deployed: {camp.deployedOperatorIds.length}{camp.lockedAt ? ` (locked at ${camp.lockedDeployedCount})` : ''}</div>
            <div style={{fontSize:11,fontStyle:'italic',color:'var(--amber-dim)',marginTop:6}}>"{campaignMilestoneLine(camp, planetPct)}"</div>
            {camp.lore && (
              <details style={{marginTop:8}}>
                <summary style={{cursor:'pointer',fontSize:10,color:'var(--text-dim)',fontFamily:"'IBM Plex Mono',monospace",letterSpacing:'0.05em'}}>FULL BRIEFING</summary>
                <div style={{fontSize:11,lineHeight:1.7,color:'var(--text-dim)',marginTop:8,whiteSpace:'pre-line'}}>{camp.lore}</div>
              </details>
            )}
            <div style={{marginTop:10,display:'flex',gap:8,flexWrap:'wrap'}}>
              {isDeployed && <button className="ghost small" onClick={()=>onUndeploy(activeOp)}>Undeploy</button>}
              {!isDeployed && !deployedId && phase==='recruiting' && <button className="primary small" onClick={()=>onDeploy(activeOp, camp)}>Deploy</button>}
              {!isDeployed && !deployedId && phase==='active' && canDeployReinforcement && <button className="primary small" onClick={()=>onDeploy(activeOp, camp)}>Deploy (Reinforcement Drop)</button>}
              {!isDeployed && deployedId && deployedId !== camp.id && <span className="dim" style={{fontSize:11}}>Already deployed elsewhere</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Habits({ op, logs, onAddHabit, onToggleArchive, onCheckin }) {
  const [newHabit, setNewHabit] = useState('');
  const habits = op.habits || [];
  const active = habits.filter(h=>h.active);
  const archived = habits.filter(h=>!h.active);
  function habitStreak(habitId) {
    const days = new Set(logs.filter(l=>l.type==='habit' && l.operatorId===op.id && l.habitId===habitId).map(l=>l.date));
    let streak = 0; let cursor = new Date();
    if (!days.has(todayStr())) cursor.setDate(cursor.getDate()-1);
    while (days.has(todayStr(cursor))) { streak++; cursor.setDate(cursor.getDate()-1); }
    return streak;
  }
  return (
    <div>
      <div className="panel">
        <div className="bracket-label">Daily Habits</div>
        <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:16}}>Habits feed the Personal Development slice of your ORS.</div>
        {active.length === 0 && <div className="empty"><div className="empty-title">No active habits yet.</div></div>}
        {active.map(h => {
          const checkedToday = logs.some(l=>l.type==='habit' && l.operatorId===op.id && l.habitId===h.id && l.date===todayStr());
          return (
            <div key={h.id} className="field-row">
              <span>{h.name} <span className="dim mono" style={{fontSize:10}}>({habitStreak(h.id)} day streak)</span></span>
              <span style={{display:'flex',gap:8}}>
                <button className={checkedToday?'primary small':'ghost small'} onClick={()=>onCheckin(op, h.id)} disabled={checkedToday}>{checkedToday?'Done Today':'Check In'}</button>
                <button className="ghost small" onClick={()=>onToggleArchive(op, h.id)}>Archive</button>
              </span>
            </div>
          );
        })}
        <div style={{display:'flex',gap:8,marginTop:16}}>
          <input type="text" value={newHabit} onChange={e=>setNewHabit(e.target.value)} placeholder="e.g. Drink 64oz water" style={{flex:1}} />
          <button className="primary" onClick={()=>{ if(newHabit.trim()){ onAddHabit(op, newHabit.trim()); setNewHabit(''); } }}>Add Habit</button>
        </div>
      </div>
      {archived.length > 0 && (
        <div className="panel">
          <div className="bracket-label">Archived Habits</div>
          {archived.map(h => <div key={h.id} className="field-row"><span className="dim">{h.name}</span><button className="ghost small" onClick={()=>onToggleArchive(op, h.id)}>Reactivate</button></div>)}
        </div>
      )}
    </div>
  );
}

function squadStats(squad, operators, campaigns, logs) {
  const memberOps = squad.members.map(m => operators.find(o=>o.id===m.operatorId)).filter(Boolean);
  const totalMCP = memberOps.reduce((s,o)=>s+computeMCP(o.id,campaigns,logs),0);
  const avgORS = memberOps.length ? Math.round(memberOps.reduce((s,o)=>s+computeORS(o.id,o,logs).ors,0)/memberOps.length) : 0;
  const campaignContribution = logs.filter(l=>l.type==='campaign' && memberOps.some(o=>o.id===l.operatorId)).reduce((s,l)=>s+(l.amount||0),0);
  return { memberCount: memberOps.length, totalMCP, avgORS, campaignContribution };
}

function SquadTab({ activeOp, operators, squads, logs, campaigns, onCreate, onJoin, onLeave, onPromote, onDemote, onRemoveMember, onRename, onDisband }) {
  const [newSquadName, setNewSquadName] = useState('');
  const [renaming, setRenaming] = useState(false);
  const [renameVal, setRenameVal] = useState('');
  const [confirmDisband, setConfirmDisband] = useState(false);
  const [confirmLeave, setConfirmLeave] = useState(false);

      <div>

          <div className="bracket-label">Squads — Opt-In</div>

          </div>

    const o = operators.find(o=>o.id===m.operatorId);
    return o ? Object.assign({}, o, {role: m.role}) : null;
  }).filter(Boolean);

  const allStats = squads.map(s => ({ squad: s, stats: squadStats(s, operators, campaigns, logs) }));

  return (

                <button className="ghost small" onClick={()=>setRenaming(false)}>Cancel</button>
              </div>

              <div className="disp" style={{fontSize:24}}>{mySquad.name}</div>
            )}

          <tbody>
            {memberOps.map(m => {
              const ors = computeORS(m.id, m, logs).ors;
              const mcp = computeMCP(m.id, campaigns, logs);
              return (
                <tr key={m.id}>
                  <td className="disp" style={{fontFamily:"'Oswald',sans-serif"}}>{m.callsign}</td>
                  <td>{m.role}</td>
                  <td className="amber">{ors}</td>
                  <td>{mcp}</td>
                  {isLeadership && m.id !== activeOp.id && (
                    <td style={{display:'flex',gap:6}}>

function planetFactionClass(planet) {
  const text = (planet.title + ' ' + planet.body).toLowerCase();
  if (text.includes('kharvax')) return 'faction-kharvax';
  if (text.includes('voss')) return 'faction-voss';
  if (text.includes('skarn')) return 'faction-skarn';
  return 'faction-unknown';
}
function planetPosition(idx, total) {
  const angle = (idx / Math.max(1,total)) * 2 * Math.PI - Math.PI/2;
  const radiusX = 36, radiusY = 34;
  const left = 50 + radiusX * Math.cos(angle);
  const top = 50 + radiusY * Math.sin(angle);
  return { left: left+'%', top: top+'%' };
}
function planetStatus(planet, campaigns, logs) {
  const matches = campaigns.filter(c => c.sector === planet.title);
  if (matches.length === 0) return { label: 'Uncharted', detail: null, campaign: null };
  const active = matches.find(c => campaignPhase(c) === 'active' || campaignPhase(c) === 'recruiting');
  if (active) {
    const pct = Math.round(computePlanetControl(computeLocationProgress(active, logs)));
    return { label: `Contested — ${pct}% Control`, detail: campaignPhase(active), campaign: active };
  }
  const success = matches.find(c => c.resolved === 'success');
  if (success) return { label: 'Secured', detail: 'success', campaign: success };
  const failed = matches.filter(c => c.resolved === 'failed');
  if (failed.length) return { label: 'Contested (past Campaign failed)', detail: 'failed', campaign: failed[failed.length-1] };
  return { label: 'Uncharted', detail: null, campaign: null };
}

function personalBest(operatorId, logs, exerciseName) {
  const prior = logs.filter(l => l.type==='protocol' && l.operatorId===operatorId && l.exercise===exerciseName);
  if (prior.length === 0) return null;
  return Math.max.apply(null, prior.map(l=>l.totalValue));
}

function LogActivity({ deployedCampaign, activeOp, logs, addLogs, campaigns, exercises, protocolSessions }) {
  const builtInSessions = protocolSessions.filter(s => !s.requiresSpecialization || s.requiresSpecialization === activeOp.specialization);
  const combinedSessions = builtInSessions.concat((activeOp.customProtocols||[]).map(cp => ({
    id: cp.id, protocol: 'Custom', name: cp.name, objectives: cp.objectives, briefing: null, trainingNote: null, conditioningOptions: []
  })));

  const [mode, setMode] = useState('structured');
  const [sessionId, setSessionId] = useState(combinedSessions[0] ? combinedSessions[0].id : '');
  const [objSets, setObjSets] = useState({});
  const [objVariant, setObjVariant] = useState({});
  const [feedback, setFeedback] = useState(null);
  const [protocolLabel, setProtocolLabel] = useState('Protocol Alpha');
  const [pending, setPending] = useState([]);
  const [exName, setExName] = useState(exercises[0] ? exercises[0].name : '');
  const [variant, setVariant] = useState(exercises[0] ? exercises[0].name : '');
  const [sets, setSets] = useState([{reps:'', weight:''}]);
  const [duration, setDuration] = useState('');
  const [locationId, setLocationId] = useState(null);
  const [amount, setAmount] = useState('');

  if (exercises.length === 0 || protocolSessions.length === 0) {
    return <div className="panel"><div className="empty"><div className="empty-title">Exercise or Protocol Session library not loaded.</div><div>Run exercises_and_sessions_to_db.sql in Supabase, then refresh.</div></div></div>;
  }

  const session = combinedSessions.find(s => s.id === sessionId) || combinedSessions[0];
  function getObjSets(idx, obj) { if (objSets[idx]) return objSets[idx]; return Array.from({length: obj.sets}, () => ({reps:'', weight:''})); }
  function updateObjSet(idx, setIdx, field, val) {
    const cur = getObjSets(idx, session.objectives[idx]).slice();
    cur[setIdx] = Object.assign({}, cur[setIdx], {[field]: val});
    setObjSets(Object.assign({}, objSets, {[idx]: cur}));
  }

  async function submitStructuredSession() {
    const entries = []; const now = Date.now(); const autoNotes = []; const prNotes = [];
    session.objectives.forEach((obj, idx) => {
      const setRows = getObjSets(idx, obj);
      const totalValue = setRows.reduce((s,r)=> s + (parseFloat(r.reps)||0), 0);
      if (totalValue <= 0) return;
      const variantUsed = objVariant[idx] || obj.name;
      const priorBest = personalBest(activeOp.id, logs, obj.name);
      if (priorBest !== null && totalValue > priorBest) prNotes.push(obj.name+' — new personal best! ('+totalValue+' vs previous '+priorBest+')');
      const ts = now + idx*2; const logId = 'log_'+ts;
      entries.push({ id: logId, operatorId: activeOp.id, type:'protocol', date: todayStr(), timestamp: ts, protocolLabel: session.protocol, exercise: obj.name, variant: variantUsed, category: obj.muscleGroup, unit: obj.unit, sets: setRows.filter(r=>r.reps), totalValue: totalValue, detail: setRows.filter(r=>r.reps).map(r=>(r.reps||0)+(r.weight?'@'+r.weight+'lb':'')).join(', ') });
      if (deployedCampaign) {
        const loc = findLocationForCategory(deployedCampaign, obj.muscleGroup);
        if (loc) {
          const alreadyToday = logs.filter(l => l.type==='campaign' && l.campaignId===deployedCampaign.id && l.operatorId===activeOp.id && l.locationId===loc.id && l.date===todayStr()).concat(entries.filter(e2 => e2.type==='campaign' && e2.locationId===loc.id));
          const isFirst = alreadyToday.length === 0;
          entries.push({ id: logId+'_auto', operatorId: activeOp.id, type:'campaign', campaignId: deployedCampaign.id, locationId: loc.id, amount: totalValue, date: todayStr(), timestamp: ts+1, source:'protocol-auto', sourceExercise: obj.name });
          autoNotes.push(obj.name+' ('+totalValue+' '+obj.unit+') auto-credited to '+loc.name+(isFirst?'':' at half value (soft cap)'));
        }
      }
    });
    if (entries.length === 0) { setFeedback({cap:false,text:'Log at least one set before submitting.'}); return; }
    await addLogs(entries);
    let text = session.name+' logged, '+activeOp.callsign+'.';
    if (prNotes.length) text += ' ' + prNotes.join(' ');
    text += autoNotes.length ? ' '+autoNotes.join('. ')+'.' : (deployedCampaign ? ' No matching Location for this session\u2019s exercises.' : ' Not currently deployed \u2014 no Campaign credit applied.');
    setFeedback({ win:true, text: text });
    setObjSets({}); setObjVariant({});
  }

  const exObj = exercises.find(e => e.name === exName);
  const isTimeBased = exObj.unit === 'minutes' || exObj.unit === 'seconds';
  function updateSet(i, field, val) { const ns = sets.slice(); ns[i] = Object.assign({}, ns[i], {[field]: val}); setSets(ns); }
  function addSetRow() { setSets(sets.concat([{reps:'', weight:''}])); }
  function removeSetRow(i) { setSets(sets.filter((_,idx)=>idx!==i)); }
  function addExerciseToPending() {
    let totalValue = 0, detail = '';
    if (isTimeBased) { totalValue = parseFloat(duration) || 0; detail = totalValue + ' ' + exObj.unit; }
    else { totalValue = sets.reduce((s,st) => s + (parseFloat(st.reps)||0), 0); detail = sets.map(st => (st.reps||0)+(st.weight?'@'+st.weight+'lb':'')).join(', '); }
    if (totalValue <= 0) return;
    setPending(pending.concat([{ exercise: exName, variant: variant, muscleGroup: exObj.muscleGroup, unit: exObj.unit, isTimeBased: isTimeBased, sets: isTimeBased ? [] : sets.filter(s=>s.reps), totalValue: totalValue, detail: detail }]));
    setSets([{reps:'',weight:''}]); setDuration('');
  }
  function removePending(i) { setPending(pending.filter((_,idx)=>idx!==i)); }

  async function submitFreeformSession() {
    if (pending.length === 0) return;
    const entries = []; const now = Date.now(); const autoNotes = []; const prNotes = [];
    pending.forEach((ex, i) => {
      const priorBest = personalBest(activeOp.id, logs, ex.exercise);
      if (priorBest !== null && ex.totalValue > priorBest) prNotes.push(ex.exercise+' — new personal best!');
      const ts = now + i*2; const logId = 'log_'+ts;
      entries.push({ id: logId, operatorId: activeOp.id, type:'protocol', date: todayStr(), timestamp: ts, protocolLabel: protocolLabel, exercise: ex.exercise, variant: ex.variant, category: ex.muscleGroup, unit: ex.unit, sets: ex.sets, totalValue: ex.totalValue, detail: ex.detail });
      if (deployedCampaign) {
        const loc = findLocationForCategory(deployedCampaign, ex.muscleGroup);
        if (loc) {
          const alreadyToday = logs.filter(l => l.type==='campaign' && l.campaignId===deployedCampaign.id && l.operatorId===activeOp.id && l.locationId===loc.id && l.date===todayStr()).concat(entries.filter(e2 => e2.type==='campaign' && e2.locationId===loc.id));
          const isFirst = alreadyToday.length === 0;
          entries.push({ id: logId+'_auto', operatorId: activeOp.id, type:'campaign', campaignId: deployedCampaign.id, locationId: loc.id, amount: ex.totalValue, date: todayStr(), timestamp: ts+1, source:'protocol-auto', sourceExercise: ex.exercise });
          autoNotes.push(ex.exercise+' ('+ex.totalValue+' '+ex.unit+') auto-credited to '+loc.name+(isFirst?'':' at half value (soft cap)'));
        }
      }
    });
    await addLogs(entries);
    let text = 'Session logged, '+activeOp.callsign+'. '+pending.length+' exercise(s) recorded.';
    if (prNotes.length) text += ' ' + prNotes.join(' ');
    text += autoNotes.length ? ' ' + autoNotes.join('. ') + '.' : (deployedCampaign ? ' No matching Location.' : ' Not currently deployed \u2014 no Campaign credit applied.');
    setFeedback({ win: true, text: text });
    setPending([]);
  }

  function submitManualCampaign() {
    if (!deployedCampaign) { setFeedback({cap:false, text:'Deploy to a Campaign first \u2014 see the Campaigns tab.'}); return; }
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { setFeedback({cap:false, text:'Enter a valid amount before submitting, Operator.'}); return; }
    const locId = locationId || deployedCampaign.locations[0].id;
    const now = Date.now();
    const entry = { id:'log_'+now, operatorId: activeOp.id, type:'campaign', campaignId: deployedCampaign.id, locationId: locId, amount: amt, date: todayStr(), timestamp: now };
    const todaysAtLoc = logs.filter(l => l.type==='campaign' && l.campaignId===deployedCampaign.id && l.operatorId===activeOp.id && l.locationId===locId && l.date===todayStr());
    addLogs([entry]);
    if (todaysAtLoc.length >= 1) setFeedback({cap:true, text:"Contribution logged, Operator. Today's push is in \u2014 Command's got it. Anything more today still counts, just at half value. That's not a penalty. That's the mission reminding you recovery is part of it too. The Swarm doesn't stop. You're allowed to."});
    else setFeedback({cap:false, text:'Contribution logged, Operator. Command sees it.'});
    setAmount('');
  }

  const campLoc = deployedCampaign ? deployedCampaign.locations.find(l => l.id === (locationId||deployedCampaign.locations[0].id)) : null;

  return (
    <div className="panel">
      <div className="bracket-label">Log Activity — {activeOp.callsign}</div>
      <div className="field">
        <label>Activity Type</label>
        <div className="radio-group">
          <div className={"radio-opt"+(mode==='structured'?' sel':'')} onClick={()=>{setMode('structured'); setFeedback(null);}}>Structured Session</div>
          <div className={"radio-opt"+(mode==='freeform'?' sel':'')} onClick={()=>{setMode('freeform'); setFeedback(null);}}>Freeform Exercise</div>
          <div className={"radio-opt"+(mode==='campaign'?' sel':'')} onClick={()=>{setMode('campaign'); setFeedback(null);}}>Campaign Contribution (manual)</div>
        </div>
      </div>

      {mode === 'structured' && (
        <div>
          <div className="field">
            <label>Session</label>
            <select style={{width:'100%'}} value={sessionId} onChange={e=>{setSessionId(e.target.value); setObjSets({}); setObjVariant({});}}>
              <optgroup label="Built-In Protocols">

            <div className="field">
              <label>Variant / Substitution</label>
              <select style={{width:'100%'}} value={variant} onChange={e=>setVariant(e.target.value)}>
                <option value={exObj.name}>{exObj.name} (standard)</option>

function Dossier({ op, operators, campaigns, logs, squads, onUpdateOperator }) {
  const [pickingSpec, setPickingSpec] = useState(false);
  const [retesting, setRetesting] = useState(false);
  if (!op) return null;
  const orsData = computeORS(op.id, op, logs);
  const status = computeReadinessStatus(op.id, logs);
  const deployedCampaign = op.currentDeploymentId ? campaigns.find(c => c.id === op.currentDeploymentId) : null;
  const rank = computeRank(orsData.ors, op.id, logs, campaigns, status);
  const mcp = computeMCP(op.id, campaigns, logs);
  const nri = nextRankInfo(rank, orsData.ors, op.id, logs, campaigns, status);
  const specUnlocked = RANK_ORDER.indexOf(rank) >= RANK_ORDER.indexOf('Operator');
  const daysSinceBaseline = op.baseline ? daysBetween(op.baseline.date, todayStr()) : null;
  const completedCampaigns = campaigns.filter(c => c.resolved==='success' && logs.some(l=>l.operatorId===op.id && l.type==='campaign' && l.campaignId===c.id));
  const activeHabitCount = (op.habits||[]).filter(h=>h.active).length;

  function chooseSpecialization(s) { if (onUpdateOperator) onUpdateOperator(Object.assign({}, op, {specialization: s})); setPickingSpec(false); }
  function submitRetest(newBaseline) { onUpdateOperator(Object.assign({}, op, { previousBaseline: op.baseline, baseline: newBaseline })); setRetesting(false); }

  return (
    <div className="panel">
      <div className="dossier-header">
