          <div className="dossier-avatar" style={{background:op.avatarColor}}>{op.callsign.charAt(0)}</div>
          <div><div className="disp" style={{fontSize:24}}>{op.callsign}</div><div className="dim mono" style={{fontSize:11}}>{op.idNum} · Enlisted {op.joinDate}</div></div>
        </div>
        <span className={nri && nri.eligible ? "pill eligible" : "pill not-eligible"}>{nri ? (nri.eligible ? 'Promotion Eligible' : 'Not Eligible') : 'Max Rank'}</span>
      </div>

      <div className="grid2">
        <div>
          <div style={{marginBottom:18}}>
            <div className="field-label" style={{marginBottom:4}}># ORS</div>
            <div className="disp" style={{fontSize:26}}>{orsData.ors}</div>
            <div className="bar-track" style={{marginTop:6}}><div className="bar-fill" style={{width:orsData.ors+'%'}}></div></div>
          </div>
          <div style={{marginBottom:18}}>
            <div className="field-label" style={{marginBottom:4}}># Physical Capability</div>
            <div className="disp" style={{fontSize:20}}>{orsData.physical}</div>
            <div className="bar-track" style={{marginTop:6}}><div className="bar-fill" style={{width:orsData.physical+'%'}}></div></div>
            <div style={{fontSize:10,color:'var(--text-dim)',marginTop:4,lineHeight:1.6}}>
              Blend of: Protocol Completion (always active)
              {orsData.overload ? `, Progressive Overload (${orsData.overload.avgChange>0?'+':''}${orsData.overload.avgChange}% avg across ${orsData.overload.exerciseCount} exercise${orsData.overload.exerciseCount===1?'':'s'})` : ', Progressive Overload (needs 60+ days of repeated exercise logs to activate)'}
              {orsData.baselineImp ? `, Baseline Improvement (${orsData.baselineImp.avgChange>0?'+':''}${orsData.baselineImp.avgChange}%)` : ', Baseline Improvement (needs a retest to activate)'}.
            </div>
          </div>
          <div style={{marginBottom:18}}>
            <div className="field-label" style={{marginBottom:4}}># Mission Discipline</div>
            <div className="disp" style={{fontSize:20}}>{orsData.discipline}</div>
            <div className="bar-track" style={{marginTop:6}}><div className="bar-fill" style={{width:orsData.discipline+'%'}}></div></div>
          </div>
          <div style={{marginBottom:18}}>
            <div className="field-label" style={{marginBottom:4}}># Personal Development</div>
            <div className="disp" style={{fontSize:20}}>{orsData.personalDev === null ? '—' : orsData.personalDev}</div>

            <div style={{fontSize:10,color:'var(--text-dim)',marginTop:4}}>{activeHabitCount>0 ? `${activeHabitCount} active habit(s) tracked` : 'No active habits'}</div>

          </div>
          <div style={{marginBottom:18}}>
            <div className="field-label" style={{marginBottom:4}}># Mission Contribution Points</div>
            <div className="disp" style={{fontSize:20}}>{mcp}</div>
          </div>
        </div>

        <div>
          <div className="field-row"><span className="field-label">Status</span><span className={"status-pill "+status.cls}>{status.label}</span></div>

          <div className="field-row"><span className="field-label">ID</span><span className="mono">{op.idNum}</span></div>
          <div className="field-row"><span className="field-label">Join Date</span><span>{op.joinDate}</span></div>

          <div className="field-row"><span className="field-label">Squad</span><span>{op.squadId ? ((squads.find(s=>s.id===op.squadId)||{}).name + (op.squadRole!=='member' ? ' ('+op.squadRole+')' : '')) : 'Unassigned (opt-in)'}</span></div>
          <div className="field-row"><span className="field-label">Privacy Level</span><span className="pill">{op.privacy}</span></div>
          <div className="field-row"><span className="field-label">Current Deployment</span><span>{deployedCampaign ? deployedCampaign.name : '\u2014'}</span></div>
          <div className="field-row"><span className="field-label">Completed Campaigns</span><span>{completedCampaigns.length ? completedCampaigns.map(c=>c.name).join(', ') : 'None yet'}</span></div>
          <div className="field-row"><span className="field-label">Reinforcement Drops</span><span>{op.reinforcementDropsAvailable} available</span></div>
          <div className="field-row"><span className="field-label">Awards</span><span>None yet</span></div>

      </div>

      <div className="panel" style={{marginTop:0}}>
        <div className="bracket-label">Rank Progress</div>
        {nri ? (
          <div>
            <div style={{fontSize:13,marginBottom:10}}>Next rank: <span className="amber">{nri.next}</span></div>
            <div className="stat-row"><span>ORS</span><span className="stat-val">{orsData.ors} / {nri.req.ors}</span></div>
            <div className="stat-row"><span>Days Active (lifetime)</span><span className="stat-val">{nri.stats.daysActive} / {nri.req.daysActive}</span></div>
            <div className="stat-row"><span>Campaigns Completed</span><span className="stat-val">{nri.stats.campaignsCompleted} / {nri.req.campaigns}</span></div>
            <div className="stat-row"><span>Readiness Status</span><span className={status.label==='Active'?'amber':'threat'}>{status.label==='Active' ? 'Meets requirement' : 'Must be Active — currently '+status.label}</span></div>
          </div>
        ) : <div className="dim" style={{fontSize:12}}>Maximum rank achieved.</div>}
      </div>

      <div className="panel" style={{marginTop:0}}>
        <div className="bracket-label">Baseline Record</div>
        {op.baseline ? (
          <div>
            <div className="stat-row"><span>Last Test</span><span className="stat-val">{op.baseline.date} ({op.baseline.tier})</span></div>
            <div className="stat-row"><span>Push-Ups / Pull-Ups / Squats / Plank</span><span className="stat-val">{op.baseline.pushups} / {op.baseline.pullups} / {op.baseline.squats} / {op.baseline.plankSeconds}s</span></div>
            {op.previousBaseline && <div className="stat-row"><span>Previous Test</span><span className="stat-val">{op.previousBaseline.date}</span></div>}
            {daysSinceBaseline !== null && daysSinceBaseline >= 56 && <div className="info-note" style={{borderLeft:'2px solid var(--amber)'}}>It's been {daysSinceBaseline} days since your last baseline — 8 weeks is the recommended retest cadence.</div>}
          </div>
        ) : <div className="dim" style={{fontSize:12}}>No baseline on record.</div>}
        <button className="ghost small" onClick={()=>setRetesting(true)} style={{marginTop:12}}>Log Baseline Retest</button>
      </div>

      {retesting && <RetestModal onClose={()=>setRetesting(false)} onSubmit={submitRetest} />}
    </div>
  );
}

function RetestModal({ onClose, onSubmit }) {
  const [pushups, setPushups] = useState('');
  const [pullups, setPullups] = useState('');
  const [squats, setSquats] = useState('');
  const [plank, setPlank] = useState('');
  const [runMinutes, setRunMinutes] = useState('');
  function submit() {
    const pu = parseFloat(pushups)||0, pl = parseFloat(pullups)||0, sq = parseFloat(squats)||0, pk = parseFloat(plank)||0;
    let pts = 0;
    pts += pu>=41?4:pu>=26?3:pu>=11?2:pu>=1?1:0;
    pts += pl>=13?4:pl>=8?3:pl>=3?2:pl>=0?1:0;
    pts += pk>=180?4:pk>=120?3:pk>=60?2:pk>0?1:0;
    let tier = pts>=15?'Peak Tier':pts>=12?'Advanced Tier':pts>=8?'Development Tier':'Foundation Tier';
    onSubmit({ pushups: pu, pullups: pl, squats: sq, plankSeconds: pk, runMinutes: parseFloat(runMinutes)||0, score: pts, tier: tier, date: todayStr() });
  }
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="disp" style={{fontSize:18,marginBottom:16}}>Baseline Retest</div>
        <div className="field"><label>Max Push-Ups</label><input type="number" value={pushups} onChange={e=>setPushups(e.target.value)} /></div>
        <div className="field"><label>Max Pull-Ups</label><input type="number" value={pullups} onChange={e=>setPullups(e.target.value)} /></div>
        <div className="field"><label>Bodyweight Squats in 2 Minutes</label><input type="number" value={squats} onChange={e=>setSquats(e.target.value)} /></div>
        <div className="field"><label>Plank Hold (seconds)</label><input type="number" value={plank} onChange={e=>setPlank(e.target.value)} /></div>
        <div className="field"><label>1.5 Mile Run Time (minutes, optional)</label><input type="number" value={runMinutes} onChange={e=>setRunMinutes(e.target.value)} /></div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="ghost" onClick={onClose}>Cancel</button>
          <button className="primary" onClick={submit}>Submit Retest</button>
        </div>
      </div>
    </div>
  );
}

function Roster({ operators, campaigns, logs, onView }) {

        <thead><tr><th>Callsign</th><th>Rank</th><th>ORS</th><th>Status</th><th>Deployed To</th><th>Last Active</th></tr></thead>
        <tbody>
          {operators.map(op => {
            const orsData = computeORS(op.id, op, logs);
            const status = computeReadinessStatus(op.id, logs);
            const deployedCampaign = op.currentDeploymentId ? campaigns.find(c=>c.id===op.currentDeploymentId) : null;
            const rank = computeRank(orsData.ors, op.id, logs, campaigns, status);
            const opLogs = logs.filter(l => l.operatorId===op.id);

                <td className="amber">{orsData.ors}</td>

function AARLog({ operators, campaigns, logs }) {
  const sorted = logs.slice().sort((a,b) => b.timestamp - a.timestamp);
  const opName = id => { const o = operators.find(o=>o.id===id); return o ? o.callsign : id; };
  const locName = (campId, locId) => { const c = campaigns.find(c=>c.id===campId); if(!c) return locId; const l = c.locations.find(l=>l.id===locId); return l ? l.name : locId; };
  const habitName = (op, habitId) => { const o = operators.find(o=>o.id===op); if(!o) return habitId; const h=(o.habits||[]).find(h=>h.id===habitId); return h?h.name:habitId; };
  if (sorted.length === 0) return <div className="panel"><div className="empty"><div className="empty-title">No AARs filed yet.</div></div></div>;
  return (
    <div className="panel">
      <div className="bracket-label">After Action Reports — Full Log</div>
      <table>
        <thead><tr><th>Date</th><th>Operator</th><th>Type</th><th>Detail</th><th>Value</th></tr></thead>
        <tbody>
          {sorted.map(l => (
            <tr key={l.id}>
              <td>{l.date}</td>
              <td>{opName(l.operatorId)}</td>
              <td>{l.type === 'protocol' ? 'Protocol' : l.type === 'habit' ? 'Habit' : (l.source==='protocol-auto' ? 'Campaign (auto)' : 'Campaign')}</td>
              <td>{l.type === 'protocol' ? (l.variant+' — '+l.detail) : l.type === 'habit' ? habitName(l.operatorId, l.habitId) : (locName(l.campaignId, l.locationId) + (l.sourceExercise ? (' (from '+l.sourceExercise+')') : ''))}</td>
              <td>{l.type === 'protocol' ? (l.totalValue+' '+l.unit) : l.type === 'habit' ? '✓' : l.amount}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Comms({ chat, operators, squads, activeOp, onSend }) {
  const mySquad = activeOp.squadId ? squads.find(s=>s.id===activeOp.squadId) : null;
  const [channel, setChannel] = useState('main');
  const [text, setText] = useState('');
  const scrollRef = useRef(null);

  const shown = chat.filter(m => {
    if (channel === 'main') return m.channel === 'main' || m.channel === 'command';
    if (channel === 'squad') return (m.channel === 'squad' && m.squadId === (mySquad&&mySquad.id)) || m.channel === 'command';
    if (channel === 'command') return m.channel === 'command';
    return false;
  });

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [shown.length]);

  const canPost = channel === 'main' || (channel === 'squad' && mySquad) || (channel === 'command' && activeOp.isAdmin);

  function send() {
    if (!text.trim() || !canPost) return;
    const msg = { id:'chat_'+Date.now(), authorId: activeOp.id, authorName: activeOp.callsign, text: text.trim(), timestamp: Date.now(), channel: channel };
    if (channel === 'command') msg.isCommand = true;
    else msg.isCommand = false;
    if (channel === 'squad') msg.squadId = mySquad.id;
    onSend(msg);
    setText('');
  }

  return (
    <div className="panel">
      <div className="bracket-label">Comms</div>
      <div className="radio-group" style={{marginBottom:16}}>
        <div className={"radio-opt"+(channel==='main'?' sel':'')} onClick={()=>setChannel('main')}>Main</div>
        <div className={"radio-opt"+(channel==='squad'?' sel':'')} onClick={()=>setChannel('squad')}>{mySquad ? mySquad.name : 'Squad (join one to unlock)'}</div>
        <div className={"radio-opt"+(channel==='command'?' sel':'')} onClick={()=>setChannel('command')}>Command</div>
      </div>

      <div className="chat-scroll" ref={scrollRef}>
        {shown.length === 0 && <div className="empty"><div className="empty-title">No transmissions yet.</div></div>}
        {shown.map(m => (
          <div key={m.id} className={"chat-msg "+(m.isCommand?'command':(m.authorId===activeOp.id?'mine':'theirs'))}>
            <div className="chat-meta">{m.isCommand ? 'COMMAND TRANSMISSION' : m.authorName} · {new Date(m.timestamp).toLocaleString()}</div>
            <div>{m.text}</div>
          </div>
        ))}
      </div>

      {canPost ? (
        <div className="chat-input-row">
          <input type="text" value={text} onChange={e=>setText(e.target.value)} placeholder={channel==='command'?'Post a Command transmission...':'Message...'} onKeyDown={e=>{if(e.key==='Enter') send();}} />
          <button className="primary" onClick={send}>Send</button>
        </div>
      ) : (
        <div className="info-note">{channel==='squad' ? 'Join a Squad to post here.' : 'Only Command (admins) can post in this channel.'}</div>
      )}
      <div className="info-note">Live — new messages arrive instantly via realtime, no refresh needed. Command messages also appear in Main and every Squad channel.</div>
    </div>
  );
}

function AdminPanel({ operators, campaigns, onUpdateOperators, onUpdateCampaigns, exercises, protocolSessions, onSaveExercise, onDeleteExercise, onSaveProtocolSession, onDeleteProtocolSession }) {
  const [editingId, setEditingId] = useState(campaigns[0] ? campaigns[0].id : null);
  const [savedMsg, setSavedMsg] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [draft, setDraft] = useState(null);
  useEffect(() => { const c = campaigns.find(c=>c.id===editingId); setDraft(c ? JSON.parse(JSON.stringify(c)) : null); }, [editingId]);

  const [exEditing, setExEditing] = useState(null);
  const [exDraft, setExDraft] = useState(null);
  const [exConfirmDelete, setExConfirmDelete] = useState(null);
  const MUSCLE_GROUP_OPTIONS = ['Chest','Back','Shoulders','Biceps','Triceps','Quadriceps','Hamstrings','Glutes','Calves','Core','Grip','Cardio'];

  const [sessEditing, setSessEditing] = useState(null);
  const [sessDraft, setSessDraft] = useState(null);
  const [sessConfirmDelete, setSessConfirmDelete] = useState(null);

  function updateLocField(idx, field, val) {
    const locs = draft.locations.slice();
    locs[idx] = Object.assign({}, locs[idx], { [field]: field==='manualTarget' ? (val?Number(val):null) : val });
    setDraft(Object.assign({}, draft, {locations: locs}));
  }
  function addLocation() { setDraft(Object.assign({}, draft, {locations: draft.locations.concat([{ id: 'loc_'+Date.now(), name: 'New Location', objective: 'Total reps', category: 'Chest', unit: 'reps', manualTarget: null }])})); }
  function removeLocation(idx) { setDraft(Object.assign({}, draft, {locations: draft.locations.filter((_,i)=>i!==idx)})); }
  async function saveCampaign() {
    const exists = campaigns.some(c=>c.id===draft.id);
    const newCamps = exists ? campaigns.map(c => c.id === draft.id ? draft : c) : campaigns.concat([draft]);
    await onUpdateCampaigns(newCamps);
    setEditingId(draft.id);
    setSavedMsg('Saved.'); setTimeout(()=>setSavedMsg(''), 2000);
  }
  async function forceLockWindow() {
    const count = Math.max(1, draft.deployedOperatorIds.length);
    const targets = {}; draft.locations.forEach(loc => { targets[loc.id] = locationTarget(draft, loc); });
    const updated = Object.assign({}, draft, {lockedAt: todayStr(), lockedTargets: targets, lockedDeployedCount: count});
    setDraft(updated);
    await onUpdateCampaigns(campaigns.map(c => c.id === updated.id ? updated : c));
  }
  async function forceResolve(result) {
    const updated = Object.assign({}, draft, {resolved: result});
    setDraft(updated);
    const clearedOps = operators.map(o => o.currentDeploymentId === updated.id ? Object.assign({}, o, {currentDeploymentId:null}) : o);
    await onUpdateOperators(clearedOps);
    await onUpdateCampaigns(campaigns.map(c => c.id === updated.id ? updated : c));
  }
  function updateOpField(id, field, val) {
    const parsedVal = field==='weeklyTarget' ? Number(val) : val;
    const patch = { [field]: parsedVal };
    const target = operators.find(o=>o.id===id);
    // Admin/Moderator status confers a title automatically — Command and Engineer
    // are never manually chosen. Admin always takes precedence if both are set.
    if (field === 'isAdmin') {
      patch.specialization = parsedVal ? CONFERRED_TITLES.admin : ((target && target.isModerator) ? CONFERRED_TITLES.moderator : null);
    }
    if (field === 'isModerator' && !(target && target.isAdmin)) {
      patch.specialization = parsedVal ? CONFERRED_TITLES.moderator : null;
    }
    onUpdateOperators(operators.map(o => o.id === id ? Object.assign({}, o, patch) : o));
  }
  function deleteOperator(id) { onUpdateOperators(operators.filter(o => o.id !== id)); setConfirmDelete(null); }

  return (
    <div>
      <div className="panel">
        <div className="bracket-label">Admin — Campaigns</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {campaigns.map(c => <button key={c.id} className={editingId===c.id?'primary small':'ghost small'} onClick={()=>setEditingId(c.id)}>{c.name}</button>)}
          <button className="ghost small" onClick={()=>{const id='camp_'+Date.now(); setEditingId(null); setDraft({id:id, name:'New Campaign', threat:'Unknown', sector:'Unassigned Sector', startDate: todayStr(), joinWindowDays:5, durationDays:28, locations:[], lockedAt:null, lockedTargets:null, lockedDeployedCount:0, deployedOperatorIds:[], reinforcementsUsed:0, resolved:null, lore:''});}}>+ New Campaign</button>
        </div>
        {draft && (
          <div>
            <div className="field"><label>Campaign Name</label><input type="text" value={draft.name} onChange={e=>setDraft(Object.assign({},draft,{name:e.target.value}))} /></div>
            <div className="grid2">
              <div className="field"><label>Threat / Faction</label><input type="text" value={draft.threat} onChange={e=>setDraft(Object.assign({},draft,{threat:e.target.value}))} /></div>
              <div className="field"><label>Sector</label><input type="text" value={draft.sector} onChange={e=>setDraft(Object.assign({},draft,{sector:e.target.value}))} /></div>
            </div>
            <div className="grid2">
              <div className="field"><label>Join Window (days)</label><input type="number" value={draft.joinWindowDays} onChange={e=>setDraft(Object.assign({},draft,{joinWindowDays:Number(e.target.value)}))} /></div>
              <div className="field"><label>Duration (days)</label><input type="number" value={draft.durationDays} onChange={e=>setDraft(Object.assign({},draft,{durationDays:Number(e.target.value)}))} /></div>
            </div>
            <div className="field"><label>Full Lore Briefing (optional — shown as an expandable "Full Briefing" to deployed operators)</label>
              <textarea value={draft.lore||''} onChange={e=>setDraft(Object.assign({},draft,{lore:e.target.value}))} rows="8" style={{width:'100%'}} placeholder="Write the deeper story behind this Campaign — why this world matters, what's at stake, who's already been lost..." />
            </div>
            <label style={{marginTop:8}}>Locations</label>
            {draft.locations.map((loc, idx) => (
              <div key={loc.id} style={{border:'1px solid var(--border)',borderRadius:2,padding:12,marginBottom:10}}>
                <div className="grid2">
                  <div className="field"><label>Location Name</label><input type="text" value={loc.name} onChange={e=>updateLocField(idx,'name',e.target.value)} /></div>
                  <div className="field"><label>Objective Description</label><input type="text" value={loc.objective} onChange={e=>updateLocField(idx,'objective',e.target.value)} /></div>
                </div>
                <div className="grid2">
                  <div className="field"><label>Category</label>
                    <select style={{width:'100%'}} value={loc.category} onChange={e=>updateLocField(idx,'category',e.target.value)}>{LOCATION_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}</select>
                  </div>
                  <div className="field"><label>Unit</label><input type="text" value={loc.unit} onChange={e=>updateLocField(idx,'unit',e.target.value)} /></div>
                </div>
                <div className="field"><label>Manual Target Override (blank = auto-calculated)</label><input type="number" value={loc.manualTarget||''} onChange={e=>updateLocField(idx,'manualTarget',e.target.value)} /></div>
                <div style={{fontSize:11,color:'var(--text-dim)',marginBottom:8}}>Current computed target: {locationTarget(draft, loc)} {loc.unit}</div>
                <button className="small danger" onClick={()=>removeLocation(idx)}>Remove Location</button>
              </div>
            ))}
            <button className="ghost small" onClick={addLocation} style={{marginBottom:14}}>+ Add Location</button>
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button className="primary" onClick={saveCampaign}>Save Campaign</button>
              {!draft.lockedAt && <button className="ghost" onClick={forceLockWindow}>Force Lock Join Window Now</button>}
              {draft.lockedAt && !draft.resolved && <button className="ghost" onClick={()=>forceResolve('success')}>Force Resolve: Success</button>}
              {draft.lockedAt && !draft.resolved && <button className="danger" onClick={()=>forceResolve('failed')}>Force Resolve: Failed</button>}
              {savedMsg && <span style={{color:'var(--success)',fontSize:12}}>{savedMsg}</span>}
            </div>
          </div>
        )}
      </div>

      <div className="panel">
        <div className="bracket-label">Admin — Exercise Library ({exercises.length})</div>
        <div style={{maxHeight:300,overflowY:'auto',marginBottom:14}}>
          {exercises.map(ex => (
            <div key={ex.id} className="field-row">
              <span>{ex.name} <span className="dim mono" style={{fontSize:10}}>({ex.muscleGroup} · {ex.unit})</span></span>
              <span style={{display:'flex',gap:6}}>
                <button className="small ghost" onClick={()=>{setExEditing(ex.id); setExDraft(Object.assign({},ex,{altText:(ex.alternatives||[]).join(', ')}));}}>Edit</button>
                {exConfirmDelete===ex.id ? (
                  <span style={{display:'flex',gap:4}}><button className="small danger" onClick={()=>{onDeleteExercise(ex.id); setExConfirmDelete(null);}}>Confirm</button><button className="small ghost" onClick={()=>setExConfirmDelete(null)}>Cancel</button></span>
                ) : <button className="small ghost" onClick={()=>setExConfirmDelete(ex.id)}>Delete</button>}
              </span>
            </div>
          ))}
        </div>
        {exDraft ? (
          <div style={{border:'1px solid var(--border)',borderRadius:2,padding:12}}>
            <div className="field"><label>Name</label><input type="text" value={exDraft.name} onChange={e=>setExDraft(Object.assign({},exDraft,{name:e.target.value}))} /></div>
            <div className="grid2">
              <div className="field"><label>Muscle Group</label>
                <select style={{width:'100%'}} value={exDraft.muscleGroup} onChange={e=>setExDraft(Object.assign({},exDraft,{muscleGroup:e.target.value}))}>
                  {MUSCLE_GROUP_OPTIONS.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div className="field"><label>Unit</label>
                <select style={{width:'100%'}} value={exDraft.unit} onChange={e=>setExDraft(Object.assign({},exDraft,{unit:e.target.value}))}>
                  <option value="reps">reps</option><option value="seconds">seconds</option><option value="minutes">minutes</option>
                </select>
              </div>
            </div>
            <div className="field"><label>Alternatives (comma-separated)</label><input type="text" value={exDraft.altText||''} onChange={e=>setExDraft(Object.assign({},exDraft,{altText:e.target.value}))} /></div>
            <div style={{display:'flex',gap:8}}>
              <button className="primary small" onClick={()=>{
                const toSave = { id: exDraft.id, name: exDraft.name, muscleGroup: exDraft.muscleGroup, unit: exDraft.unit, alternatives: exDraft.altText.split(',').map(s=>s.trim()).filter(Boolean) };
                onSaveExercise(toSave); setExDraft(null); setExEditing(null);
              }}>Save</button>
              <button className="ghost small" onClick={()=>{setExDraft(null); setExEditing(null);}}>Cancel</button>
            </div>
          </div>
        ) : (
          <button className="ghost small" onClick={()=>setExDraft({id:undefined, name:'', muscleGroup:'Chest', unit:'reps', altText:''})}>+ Add Exercise</button>
        )}
      </div>

      <div className="panel">
        <div className="bracket-label">Admin — Protocol Session Library ({protocolSessions.length})</div>
        <div style={{maxHeight:300,overflowY:'auto',marginBottom:14}}>
          {protocolSessions.map(s => (
            <div key={s.id} className="field-row">
              <span>{s.protocol} — {s.name} <span className="dim mono" style={{fontSize:10}}>({s.objectives.length} exercises{s.requiresSpecialization?', '+s.requiresSpecialization:''})</span></span>
              <span style={{display:'flex',gap:6}}>
                <button className="small ghost" onClick={()=>{setSessEditing(s.id); setSessDraft(JSON.parse(JSON.stringify(s)));}}>Edit</button>
                {sessConfirmDelete===s.id ? (
                  <span style={{display:'flex',gap:4}}><button className="small danger" onClick={()=>{onDeleteProtocolSession(s.id); setSessConfirmDelete(null);}}>Confirm</button><button className="small ghost" onClick={()=>setSessConfirmDelete(null)}>Cancel</button></span>
                ) : <button className="small ghost" onClick={()=>setSessConfirmDelete(s.id)}>Delete</button>}
              </span>
            </div>
          ))}
        </div>
        {sessDraft ? (
          <div style={{border:'1px solid var(--border)',borderRadius:2,padding:12}}>
            <div className="grid2">
              <div className="field"><label>Protocol Label</label><input type="text" value={sessDraft.protocol} onChange={e=>setSessDraft(Object.assign({},sessDraft,{protocol:e.target.value}))} /></div>
              <div className="field"><label>Session Name</label><input type="text" value={sessDraft.name} onChange={e=>setSessDraft(Object.assign({},sessDraft,{name:e.target.value}))} /></div>
            </div>
            <div className="field"><label>Briefing</label><textarea value={sessDraft.briefing||''} onChange={e=>setSessDraft(Object.assign({},sessDraft,{briefing:e.target.value}))} rows="2" style={{width:'100%'}} /></div>
            <div className="field"><label>Training Note</label><textarea value={sessDraft.trainingNote||''} onChange={e=>setSessDraft(Object.assign({},sessDraft,{trainingNote:e.target.value}))} rows="2" style={{width:'100%'}} /></div>
            <div className="field"><label>Requires Specialization (blank = available to everyone)</label>
              <input type="text" value={sessDraft.requiresSpecialization||''} onChange={e=>setSessDraft(Object.assign({},sessDraft,{requiresSpecialization:e.target.value||null}))} placeholder="e.g. Heavy Assault" />
            </div>
            <label>Objectives ({sessDraft.objectives.length})</label>
            {sessDraft.objectives.map((o,i) => (
              <div key={i} className="exercise-pending">
                <div>{o.name} — {o.sets}×{o.repLow}-{o.repHigh} {o.unit} ({o.muscleGroup})</div>
                <button className="small ghost" onClick={()=>setSessDraft(Object.assign({},sessDraft,{objectives:sessDraft.objectives.filter((_,idx)=>idx!==i)}))}>Remove</button>
              </div>
            ))}
            {exercises.length > 0 && (
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <select id="sessAddEx" style={{flex:1}} defaultValue={exercises[0].name}>
                  {exercises.map(ex => <option key={ex.name} value={ex.name}>{ex.name}</option>)}
                </select>
                <button className="ghost small" onClick={()=>{
                  const sel = document.getElementById('sessAddEx').value;
                  const ex = exercises.find(e=>e.name===sel);
                  setSessDraft(Object.assign({},sessDraft,{objectives: sessDraft.objectives.concat([{name:ex.name, muscleGroup:ex.muscleGroup, unit:ex.unit, sets:3, repLow:10, repHigh:12, alternatives:ex.alternatives}])}));
                }}>+ Add Exercise</button>
              </div>
            )}
            <div style={{display:'flex',gap:8,marginTop:14}}>
              <button className="primary small" onClick={()=>{
                const toSave = Object.assign({}, sessDraft, {id: sessDraft.id || ('custom_session_'+Date.now())});
                onSaveProtocolSession(toSave); setSessDraft(null); setSessEditing(null);
              }}>Save Session</button>
              <button className="ghost small" onClick={()=>{setSessDraft(null); setSessEditing(null);}}>Cancel</button>
            </div>
          </div>
        ) : (
          <button className="ghost small" onClick={()=>setSessDraft({id:undefined, protocol:'Protocol Alpha', name:'New Session', briefing:'', trainingNote:'', conditioningOptions:[], requiresSpecialization:null, objectives:[]})}>+ Add Protocol Session</button>
        )}
      </div>

      <div className="panel">
        <div className="bracket-label">Admin — Roster Management</div>
        <div className="info-note" style={{marginBottom:12}}>Toggling Admin or Mod automatically sets the operator's title to Command or Engineer — these titles are conferred by role, not chosen. Admin takes precedence if both are checked.</div>
        <table>
          <thead><tr><th>Callsign</th><th>Weekly Target</th><th>Age Division</th><th>Admin</th><th>Mod</th><th>Title</th><th></th></tr></thead>
          <tbody>
            {operators.map(o => (
              <tr key={o.id}>
                <td className="disp" style={{fontFamily:"'Oswald',sans-serif"}}>{o.callsign}</td>
                <td><input type="number" value={o.weeklyTarget} onChange={e=>updateOpField(o.id,'weeklyTarget',e.target.value)} style={{width:60}} /></td>
                <td><select value={o.ageDivision} onChange={e=>updateOpField(o.id,'ageDivision',e.target.value)}>{AGE_DIVISIONS.map(a => <option key={a} value={a}>{a}</option>)}</select></td>
                <td><input type="checkbox" checked={!!o.isAdmin} onChange={e=>updateOpField(o.id,'isAdmin',e.target.checked)} /></td>
                <td><input type="checkbox" checked={!!o.isModerator} onChange={e=>updateOpField(o.id,'isModerator',e.target.checked)} /></td>
                <td className="dim" style={{fontSize:11}}>{o.isAdmin ? 'Command' : (o.isModerator ? 'Engineer' : '—')}</td>
                <td>
                  {confirmDelete===o.id ? (
                    <span style={{display:'flex',gap:6}}><button className="small danger" onClick={()=>deleteOperator(o.id)}>Confirm</button><button className="small ghost" onClick={()=>setConfirmDelete(null)}>Cancel</button></span>
                  ) : <button className="small ghost" onClick={()=>setConfirmDelete(o.id)}>Delete</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
